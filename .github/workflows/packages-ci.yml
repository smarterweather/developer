name: packages-ci
on:
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/packages-ci.yml"
      - "package.json"
      - "package-lock.json"
jobs:
  # The MCP Registry rejects a server.json description over 100 characters
  # (422 at publish time, after npm already has the release).
  registry-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: server.json description <= 100 chars
        run: |
          set -euo pipefail
          failed=0
          for f in packages/*/server.json; do
            len="$(jq -r '.description | length' "$f")"
            echo "${f}: ${len} chars"
            if [ "$len" -gt 100 ]; then
              echo "::error file=${f}::description is ${len} chars; the MCP Registry accepts at most 100."
              failed=1
            fi
          done
          exit "$failed"
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [mcp-weather, mcp-onboarding]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@smarterweather/${{ matrix.package }}
      # Post-build invocation smoke. Both packages are real
      # stdio<->HTTP bridges now (they would block waiting for
      # JSON-RPC input when called with no args), so pass --version
      # to keep the smoke a clean exit-0 check.
      - name: Bin invocation smoke
        run: node packages/${{ matrix.package }}/dist/index.js --version
      - name: Unit tests
        run: npm test --workspace=@smarterweather/${{ matrix.package }}
