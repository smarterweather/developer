name: plugin-ci
on:
  pull_request:
    paths:
      - "plugins/**"
      - ".cursor-plugin/**"
      - ".github/workflows/plugin-ci.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Agent Plugin
        run: node plugins/smarterweather/scripts/validate.mjs
