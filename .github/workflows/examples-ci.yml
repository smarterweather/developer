name: examples-ci
# Runs every example under examples/ against a Prism mock of openapi.yaml,
# behind a proxy that records each request, and checks the MCP configs
# statically. No secrets and no call to the real API, so it runs the same on
# forks. The repo-wide key scan is key-scan.yml. See examples/README.md.
# No path filter: the checks read files across the repo (openapi.yaml, the
# mcp-weather package, READMEs and links), and the job takes about a minute
# (61 s on 2026-10-16; about 25 s of that is the React example's install,
# next build and five next start runs).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/_harness
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/**/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version-file: examples/rest/go/weather/go.mod
          cache: false
      - name: Install the harness (Prism 5.14.2, ajv)
        run: npm ci
      - name: Validate index.json, links and the key constant
        run: npm run validate
      - name: Harness unit tests
        run: npm run test:unit
      - name: Run every example against the mock
        run: npm test
