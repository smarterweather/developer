name: Rulesets CD

on:
  push:
    branches: [main]
    paths:
      - ".github/rulesets/**"
      - "scripts/apply-rulesets.sh"
      - ".github/workflows/rulesets-cd.yml"
  workflow_dispatch:

# Note: GITHUB_TOKEN cannot manage repository rulesets at any permission
# level -- "administration" is not in the set of permissions that the
# workflow token can be granted. We therefore mint an installation token
# at job time from a GitHub App ("smarterweather-rulesets-cd") owned by
# the smarterweather org and installed on this repository with the
# "Administration: Read and write" permission. See
# .github/rulesets/README.md for setup details.
permissions:
  contents: read

concurrency:
  # Never run two applies at once -- the API has no atomic batch endpoint.
  group: rulesets-cd
  cancel-in-progress: false

jobs:
  apply:
    name: Apply rulesets to ${{ github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify GitHub App credentials are configured
        env:
          RULESETS_APP_ID: ${{ secrets.RULESETS_APP_ID }}
          RULESETS_APP_PRIVATE_KEY: ${{ secrets.RULESETS_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -z "${RULESETS_APP_ID:-}" ]] && missing+=("RULESETS_APP_ID")
          [[ -z "${RULESETS_APP_PRIVATE_KEY:-}" ]] && missing+=("RULESETS_APP_PRIVATE_KEY")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error title=Missing secret(s)::Required secret(s) not set: ${missing[*]}." \
              "Create a GitHub App on the smarterweather org with 'Administration:" \
              "Read and write' permission, install it on this repo, and store the" \
              "App ID and private key as repository secrets named RULESETS_APP_ID" \
              "and RULESETS_APP_PRIVATE_KEY. See .github/rulesets/README.md."
            exit 1
          fi

      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RULESETS_APP_ID }}
          private-key: ${{ secrets.RULESETS_APP_PRIVATE_KEY }}

      - name: Re-validate before applying
        run: ./scripts/validate-rulesets.sh

      - name: Apply rulesets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./scripts/apply-rulesets.sh "${{ github.repository }}"
