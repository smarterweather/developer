  schemas:
    # -----------------------------------------------------------------------
    # Health / deprecations / error envelope (existing F1 surfaces)
    # -----------------------------------------------------------------------

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        reader:
          type: string
          enum: [reachable, unreachable]
          description: Reader (internal data plane) connectivity status.

    Problem:
      type: object
      description: |
        RFC 7807 problem-details object served as `application/problem+json`
        on every `4xx` and `5xx` response.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
          example: https://smarterweather.com/errors/invalid-key
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri
          description: A URI reference identifying the specific occurrence.

    PlatformStatus:
      type: object
      description: |
        Platform data-freshness status document, regenerated ~every 5
        minutes by the freshness monitor. Additional fields may be added
        over time; consumers must ignore unknown fields.
      required: [version, generated_at, overall, sources]
      properties:
        version:
          type: integer
          description: Document schema version.
          example: 1
        generated_at:
          type: string
          format: date-time
          description: When this document was generated (UTC).
        overall:
          type: string
          enum: [ok, degraded, outage, no_signal]
          description: |
            Worst state across customer-facing sources. `ok` means all
            customer-facing weather data is flowing within its expected
            cadence.
        sources:
          type: array
          description: Per-source freshness states.
          items:
            $ref: '#/components/schemas/PlatformStatusSource'
        advisories:
          type: array
          description: |
            Active advisories relayed from upstream data providers (e.g.
            NOAA/NWS service notices) that may explain or foreshadow data
            gaps.
          items:
            $ref: '#/components/schemas/PlatformStatusAdvisory'

    PlatformStatusSource:
      type: object
      required: [source_id, name, provider_id, state, severity]
      properties:
        source_id:
          type: string
          description: Stable source identifier.
          example: goes
        name:
          type: string
          description: Human-readable source name.
          example: GOES ABI Satellite Imagery
        provider_id:
          type: string
          description: Upstream data provider identifier.
          example: noaa
        state:
          type: string
          enum: [ok, degraded, outage, no_signal]
        severity:
          type: string
          enum: [customer_facing, internal]
          description: |
            Whether staleness of this source is visible to end customers
            (`customer_facing`) or only affects internal products
            (`internal`).
        incident:
          type: object
          description: Present when state is not `ok` and an incident is open.
          properties:
            cause:
              type: string
              description: |
                Root-cause attribution, e.g. `provider_outage` (upstream
                stopped publishing), `processing_delay` (data arrived but
                is stuck in the pipeline), `serving_delay`, or
                `poller_stale` (our polling stopped; provider state
                unknown).
              example: provider_outage
            since:
              type: string
              format: date-time
              description: When the incident opened (UTC).
            status:
              type: string
              description: Incident lifecycle status (e.g. open, recovering).

    PlatformStatusAdvisory:
      type: object
      properties:
        title:
          type: string
          description: Advisory headline from the provider.
        provider_id:
          type: string
          example: noaa
        url:
          type: string
          format: uri
          description: Link to the provider's advisory.
        published_at:
          type: string
          format: date-time
          description: When the provider published the advisory (UTC).

    Deprecation:
      type: object
      description: |
        A single active deprecation entry. See the Versioning and
        deprecation section in `info.description` for notice-period rules.
      required: [surface, announced_at, sunset_at, migration]
      properties:
        surface:
          type: string
          description: |
            The deprecated surface, expressed as a stable identifier.
            Common forms include an operation path (`/v1/weather`),
            a parameter reference (`/v1/weather?param=foo`), or a
            response-field JSON Pointer (`/v1/weather#/current/feels_like`).
          example: "/v1/weather?param=legacy_include"
        announced_at:
          type: string
          format: date
          description: ISO 8601 date on which the deprecation was announced.
          example: "2026-04-01"
        sunset_at:
          type: string
          format: date
          description: |
            ISO 8601 date on or after which the deprecated surface may be
            removed (minimum 90 days for shape changes, 6 months for
            endpoint removal per ADR 001).
          example: "2026-07-01"
        migration:
          type: string
          description: |
            Short prose pointer to the replacement surface or migration
            guide. Clients should treat this as documentation, not a
            machine-parseable URL.
          example: "Use the `include=narrations` token instead."

    # -----------------------------------------------------------------------
    # Top-level weather response
    # -----------------------------------------------------------------------

    Weather:
      type: object
      description: |
        Composite blended weather payload returned by `GET /v1/weather`.
        Section presence is controlled by the `include` query parameter;
        every section that is present is the complete shape documented
        below.
      required: [meta, attribution]
      properties:
        location:
          $ref: '#/components/schemas/Location'
        current:
          $ref: '#/components/schemas/Current'
        hourly:
          type: array
          description: Hourly forecast, ordered ascending by `time`.
          items:
            $ref: '#/components/schemas/Hourly'
        daily:
          type: array
          description: Daily forecast, ordered ascending by `date`.
          items:
            $ref: '#/components/schemas/Daily'
        alerts:
          type: array
          description: Active NWS alerts for the location.
          items:
            $ref: '#/components/schemas/Alert'
        outlooks:
          type: array
          description: SPC convective outlooks active for the location.
          items:
            $ref: '#/components/schemas/Outlook'
        astro:
          $ref: '#/components/schemas/Astro'
        gis:
          $ref: '#/components/schemas/GIS'
        units:
          $ref: '#/components/schemas/Units'
        attribution:
          $ref: '#/components/schemas/Attribution'
        narrations:
          $ref: '#/components/schemas/Narrations'
        guidance:
          $ref: '#/components/schemas/Guidance'
        nowcast:
          $ref: '#/components/schemas/Nowcast'
        climate:
          allOf:
            - $ref: '#/components/schemas/ClimateNormals'
          description: |
            Day-of-year climate normals for the location, populated when
            `include=climate` is requested. Identical in shape to the
            `GET /v1/climate/normals` body.

            This block is the normals themselves — what is typical here. For
            how the forecast compares to them, read `daily[].climate`, which
            carries the same normals joined to each forecast day along with
            the signed departure.

            Omitted when no station with normals is near the point; that case
            reports `coverage_limited` in `meta.warnings[]` rather than
            failing the request.
        meta:
          $ref: '#/components/schemas/Meta'

    Nowcast:
      type: object
      description: |
        Minute-scale MRMS radar precipitation nowcast for the queried
        location. Populated when `include=nowcast` is requested.
      properties:
        interval_seconds:
          type: integer
          example: 300
        generated_at:
          type: string
          format: date-time
          description: Nowcast reference (anchor) time from the latest radar frame.
        summary:
          $ref: '#/components/schemas/NowcastSummary'
        points:
          type: array
          items:
            $ref: '#/components/schemas/NowcastPoint'

    NowcastSummary:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        duration_minutes:
          type: [integer, "null"]
        type:
          type: string
        peak_intensity:
          type: string
          enum: [none, light, moderate, heavy]
        already_occurring:
          type: boolean

    NowcastPoint:
      type: object
      required: [time, type, intensity_dbz, intensity]
      properties:
        time:
          type: string
          format: date-time
        type:
          type: string
        intensity_dbz:
          type: number
          format: double
        intensity:
          type: string
          enum: [none, light, moderate, heavy]

    # -----------------------------------------------------------------------
    # Location / current / hourly / daily
    # -----------------------------------------------------------------------

    Location:
      type: object
      description: Resolved location.
      required: [lat, lon, name, timezone]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
        name:
          type: string
          description: Human-readable place name (city or nearest city).
          example: "Boston"
        region:
          type: string
          description: State or region abbreviation.
          example: "MA"
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          example: "US"
        timezone:
          type: string
          description: IANA timezone identifier.
          example: "America/New_York"
        county:
          type: string
          description: County name (US only).
          example: "Suffolk"
        zip:
          type: string
          description: ZIP code (US only).
          example: "02108"

    Current:
      type: object
      description: |
        Current weather conditions derived from the RTMA + MRMS blend.
      required: [time, conditions, icon]
      properties:
        time:
          type: string
          format: date-time
          description: Observation time (ISO 8601, UTC).
        temperature:
          type: [number, "null"]
          format: double
          description: Temperature (unit per `units.temperature`).
        feels_like:
          type: [number, "null"]
          format: double
          description: Apparent temperature (wind chill or heat index).
        humidity:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
          description: Relative humidity, percent.
        dew_point:
          type: [number, "null"]
          format: double
        pressure:
          type: [number, "null"]
          format: double
          description: Atmospheric pressure (unit per `units.pressure`).
        wind_speed:
          type: [number, "null"]
          format: double
        wind_gust:
          type: [number, "null"]
          format: double
        wind_direction:
          type: [integer, "null"]
          minimum: 0
          maximum: 360
          description: Wind direction in degrees (0 = N, 90 = E).
        visibility:
          type: [number, "null"]
          format: double
          description: Visibility distance (may be null for international coverage).
        cloud_cover:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
          description: Cloud cover, percent.
        uv_index:
          type: [number, "null"]
          format: double
        aqi:
          type: [integer, "null"]
          description: Air-quality index (US EPA scale, 0-500).
        aqi_category:
          type: string
          description: |
            Human-readable AQI category (e.g., `"Good"`, `"Moderate"`,
            `"Unhealthy for Sensitive Groups"`). Omitted when AQI is
            unavailable.
        pm25:
          type: [number, "null"]
          format: double
          description: PM2.5 concentration (µg/m³).
        ozone:
          type: [number, "null"]
          format: double
          description: Ozone concentration (ppb).
        pm10:
          type: [number, "null"]
          format: double
          description: PM10 concentration (µg/m³).
        precip_rate:
          type: [number, "null"]
          format: double
          description: Current precipitation rate.
        precip_type:
          type: string
          enum: [none, rain, snow, mix, hail, unknown]
          description: |
            Current precipitation type. Omitted when no precipitation data
            is available for the location.
        lightning_density:
          type: [number, "null"]
          format: double
          description: Lightning strike density (strikes per unit area per time window).
        lightning_prob:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: Lightning probability, percent.
        conditions:
          type: string
          description: Human-readable weather description.
          example: "Partly Cloudy"
        icon:
          type: string
          description: Icon slug for UI rendering.
          example: "partly-cloudy-day"
        severe:
          type: boolean
          description: True when severe conditions are present or imminent.
          default: false

    Hourly:
      type: object
      description: Single hourly forecast point.
      required: [time]
      properties:
        time:
          type: string
          format: date-time
          description: Forecast valid time (ISO 8601, UTC).
        temperature:
          type: [number, "null"]
          format: double
        feels_like:
          type: [number, "null"]
          format: double
        humidity:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        wind_speed:
          type: [number, "null"]
          format: double
        wind_direction:
          type: [integer, "null"]
          minimum: 0
          maximum: 360
        precip_probability:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        precip_amount:
          type: [number, "null"]
          format: double
        conditions:
          type: string
        icon:
          type: string
        severe:
          type: boolean
          default: false

        # Tier 1 fields (promoted from internal-only in wx-api).
        wind_gust:
          type: [number, "null"]
          format: double
        dew_point:
          type: [number, "null"]
          format: double
        cloud_cover:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        visibility:
          type: [number, "null"]
          format: double

        # Tier 2 fields.
        pressure:
          type: [number, "null"]
          format: double
        thunderstorm_probability:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        uv_index:
          type: [number, "null"]
          format: double
        aqi:
          type: [number, "null"]
        precip_type:
          type: string
          enum: [none, rain, snow, mix, hail, unknown]
        precip_type_rain_prob:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        precip_type_snow_prob:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        precip_type_freezing_rain_prob:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        precip_type_ice_pellets_prob:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100

        # Tier 3 fields.
        cape:
          type: [number, "null"]
          format: double
          description: Convective available potential energy (J/kg).
        snow_amount:
          type: [number, "null"]
          format: double
        cloud_ceiling:
          type: [number, "null"]
          format: double
        snow_level:
          type: [number, "null"]
          format: double
        thunder_possible:
          type: boolean
          default: false
          description: |
            True when any hourly thunder indicator (`thunderstorm_probability`
            or `cape`) crosses the blender's lightning-risk threshold for this
            hour. This is a distilled flag; use
            `uncertainty.*` for raw probabilistic fields.
        uncertainty:
          description: |
            Optional probabilistic sub-object sourced from the NBM model.
            Populated only when the caller requests `include=uncertainty` and
            NBM coverage is available for the location (CONUS, Alaska, or
            Hawaii).
          oneOf:
            - $ref: '#/components/schemas/HourlyUncertainty'
            - type: "null"

    HourlyUncertainty:
      type: object
      description: |
        NBM probabilistic companion fields for a single hour. Each field is
        optional; the sub-object is omitted when no NBM data is available.
      properties:
        temperature_stddev:
          type: [number, "null"]
          format: double
          description: Ensemble standard deviation of temperature.
        dew_point_stddev:
          type: [number, "null"]
          format: double
        wind_speed_stddev:
          type: [number, "null"]
          format: double
        wind_gust_stddev:
          type: [number, "null"]
          format: double
        visibility_prob_below_1mi:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        visibility_prob_below_2mi:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        visibility_prob_below_3mi:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        visibility_prob_below_5mi:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        ceiling_prob_below_500ft:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        ceiling_prob_below_1000ft:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        ceiling_prob_below_2000ft:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        ceiling_prob_below_3000ft:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        ceiling_prob_below_6600ft:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        wind_speed_p50:
          type: [number, "null"]
          format: double
          description: NBM median 10m wind speed.
        wind_speed_prob_gt_75mph:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100

    Daily:
      type: object
      description: |
        Single daily forecast entry. Per-period weather (temperature, wind,
        precipitation, narrative) lives in `day` / `night`; top-level
        fields are aggregate values for the full calendar day.
      required: [date]
      properties:
        date:
          type: string
          format: date
          description: Forecast date (ISO 8601, local to the location's timezone).
          example: "2026-04-20"
        high:
          type: [number, "null"]
          format: double
          description: |
            Daytime maximum. May be null on the `relative_day: -1` overnight
            row, whose daytime is already past: that row reports a maximum only
            when the forecast cycle still carries one for the date, and never
            estimates it from the overnight minimum. When `high` is null the
            row also omits `day`.
        low:
          type: [number, "null"]
          format: double
          description: |
            Overnight minimum, covering 00:00–05:59 of the following calendar
            date. Present on the `relative_day: -1` row, whose remaining
            overnight hours are still ahead.
        conditions:
          type: string
        icon:
          type: string
        severe:
          type: boolean
          default: false
        precip_probability:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        precip_total:
          type: [number, "null"]
          format: double
        snow_total:
          type: [number, "null"]
          format: double
        ice_total:
          type: [number, "null"]
          format: double
        wind_speed_max:
          type: [number, "null"]
          format: double
        wind_gust_max:
          type: [number, "null"]
          format: double
          description: Maximum sustained-gust value across the calendar day.
        wind_direction:
          type: [integer, "null"]
          minimum: 0
          maximum: 360
        humidity_avg:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        cloud_cover_avg:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        uv_index_max:
          type: [number, "null"]
          format: double
        cape_max:
          type: [number, "null"]
          format: double
        dew_point_max:
          type: [number, "null"]
          format: double
        dew_point_min:
          type: [number, "null"]
          format: double
        pressure_avg:
          type: [number, "null"]
          format: double
        visibility_min:
          type: [number, "null"]
          format: double
        cloud_ceiling_min:
          type: [number, "null"]
          format: double
        thunderstorm_probability_max:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        aqi_max:
          type: [number, "null"]
          format: double
        feels_like_high:
          type: [number, "null"]
          format: double
        feels_like_low:
          type: [number, "null"]
          format: double
        solar_radiation_max:
          type: [number, "null"]
          format: double
          description: Peak downward shortwave radiation across the day (W/m^2).
        snow_level:
          type: [number, "null"]
          format: double
        thunder_possible:
          type: boolean
          default: false
          description: Distilled flag; true if any hour in the day crosses the blender's lightning-risk threshold.
        astro:
          $ref: '#/components/schemas/Astro'
        day:
          $ref: '#/components/schemas/DailyPeriod'
        night:
          $ref: '#/components/schemas/DailyPeriod'
        threats:
          type: array
          items:
            $ref: '#/components/schemas/DailyThreat'
          description: Per-day hazard callouts (winter, severe, heat, etc.).
        relative_day:
          type: integer
          description: |
            Signed calendar offset from the local current date at request time
            (-1 = yesterday, 0 = today, 1 = tomorrow). Before 6 AM local an
            extra entry with `relative_day: -1` prepends the in-progress
            overnight row. That row always reports `low` and `night`, but
            `high` and `day` only when the cycle still carries that date's
            daytime maximum. Select today by `relative_day == 0` rather than by
            position in the array, which shifts by one inside that window.
        active_period:
          type: [string, "null"]
          enum: [day, night]
          description: |
            Non-null on exactly the row containing the current local time
            (`day` during 06:00–17:59, `night` during 18:00–05:59). Clients
            use this with `relative_day` to label rows Today/Tonight without
            wall-clock heuristics.
        uncertainty:
          description: |
            Optional NBM probabilistic sub-object for this day. Populated only
            when `include=uncertainty` is requested and NBM coverage applies.
          oneOf:
            - $ref: '#/components/schemas/DailyUncertainty'
            - type: "null"
        climate:
          description: |
            Optional climate sub-object for this day. Populated only when
            `include=climate` is requested and the nearest station holds a
            normal for the date.
          oneOf:
            - $ref: '#/components/schemas/DailyClimate'
            - type: "null"

    DailyClimate:
      type: object
      description: |
        The day's normal paired with this forecast's departure from it.

        Temperatures are in the requested `unit` system, matching `high` and
        `low` on the same row. Departures are signed so that positive is
        warmer than normal, and are differences rather than absolute
        temperatures.

        Every field is nullable: a station can hold a normal high without a
        normal low, and a forecast day can fall in a gap in the station's
        record. A `0` departure means the forecast landed exactly on the
        normal, which is not the same as an absent one.

        Station provenance for these values — which station, how far away,
        and over what base period — lives in the top-level `climate` block.
      properties:
        normal_high:
          type: [number, "null"]
          format: double
          description: Normal daily maximum temperature for this day of year.
          example: 78
        normal_low:
          type: [number, "null"]
          format: double
          description: Normal daily minimum temperature for this day of year.
          example: 58
        high_departure:
          type: [number, "null"]
          format: double
          description: Forecast high minus normal high; positive is warmer than normal.
          example: 4
        low_departure:
          type: [number, "null"]
          format: double
          description: Forecast low minus normal low; positive is warmer than normal.
          example: -2

    DailyUncertainty:
      type: object
      description: |
        NBM probabilistic companion fields for a single day. All fields are
        optional; daily uncertainty entries are produced by the NBM daily
        aggregation stage.
      properties:
        temperature_stddev_avg:
          type: [number, "null"]
          format: double
        dew_point_stddev_avg:
          type: [number, "null"]
          format: double
        wind_speed_stddev_avg:
          type: [number, "null"]
          format: double
        wind_gust_stddev_avg:
          type: [number, "null"]
          format: double
        visibility_prob_below_1mi_max:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        ceiling_prob_below_1000ft_max:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        snow_total_p10:
          type: [number, "null"]
          format: double
        snow_total_p50:
          type: [number, "null"]
          format: double
        snow_total_p90:
          type: [number, "null"]
          format: double
        snow_prob_gt_1in:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        snow_prob_gt_2in:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        snow_prob_gt_4in:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100

    DailyPeriod:
      type: object
      description: |
        Forecast data for a single period (day or night) within a
        `Daily` entry.
      properties:
        temperature:
          type: [number, "null"]
          format: double
          description: High for `day`, low for `night`.
        wind_speed:
          type: [number, "null"]
          format: double
        wind_direction:
          type: [integer, "null"]
          minimum: 0
          maximum: 360
        precip_probability:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        precip_total:
          type: [number, "null"]
          format: double
        snow_total:
          type: [number, "null"]
          format: double
        ice_total:
          type: [number, "null"]
          format: double
        humidity:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        cloud_cover:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        wind_gust:
          type: [number, "null"]
          format: double
        dew_point:
          type: [number, "null"]
          format: double
        feels_like:
          type: [number, "null"]
          format: double
          description: High-for-day / low-for-night of hourly apparent temperature.
        visibility:
          type: [number, "null"]
          format: double
        pressure:
          type: [number, "null"]
          format: double
        cloud_ceiling:
          type: [number, "null"]
          format: double
        uv_index:
          type: [number, "null"]
          format: double
          description: Max UV index within the period (day only; ~0 overnight).
        thunderstorm_probability:
          type: [number, "null"]
          format: double
          minimum: 0
          maximum: 100
        cape:
          type: [number, "null"]
          format: double
        aqi:
          type: [number, "null"]
          format: double
        precip_type:
          type: string
          enum: ["", none, rain, snow, mix, sleet, freezing_rain, thunderstorms, unknown]
        thunder_possible:
          type: boolean
          default: false
        conditions:
          type: string
        icon:
          type: string
        severe:
          type: boolean
          default: false
        narrative:
          type: string
          description: Human-readable narrative for this period.

    DailyThreat:
      type: object
      description: Per-day hazard callout.
      required: [type, risk_label]
      properties:
        type:
          type: string
          description: Hazard category (e.g., `severe`, `winter`, `heat`, `fire`).
          example: "severe"
        risk:
          type: string
          description: Raw risk identifier from the upstream source.
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Fractional probability (0-1) when known.
        risk_label:
          type: string
          description: Human-readable risk label (e.g., `"Slight"`, `"Enhanced"`).

    # -----------------------------------------------------------------------
    # Alerts / outlooks / astro
    # -----------------------------------------------------------------------

    Alert:
      type: object
      description: NWS weather alert active for the requested location.
      required:
        - id
        - event
        - severity
        - urgency
        - certainty
        - headline
        - sender
        - status
        - onset
        - ends
        - effective
        - expires
        - expiration
      properties:
        id:
          type: string
          description: Unique alert identifier.
          example: "urn:oid:2.49.0.1.840.0.abc123"
        event:
          type: string
          example: "Wind Advisory"
        severity:
          type: string
          enum: [Extreme, Severe, Moderate, Minor, Unknown]
        urgency:
          type: string
          enum: [Immediate, Expected, Future, Past, Unknown]
        certainty:
          type: string
          enum: [Observed, Likely, Possible, Unlikely, Unknown]
        headline:
          type: string
        sender:
          type: string
          description: Issuing NWS office identifier.
        status:
          type: string
          description: Alert lifecycle status (e.g., `Actual`, `Exercise`, `Test`).
        onset:
          type: string
          format: date-time
        ends:
          type: string
          format: date-time
        effective:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
        expiration:
          type: string
          format: date-time
          description: Final expiration time used for cache invalidation.
        area_desc:
          type: string
          description: Human-readable affected area.
        highlights:
          type: object
          additionalProperties:
            type: string
          description: |
            Map of salient callouts extracted from the alert text
            (e.g., `{"hazard": "Strong winds", "impact": "Loose debris possible"}`).

    AlertDetail:
      type: object
      description: |
        Full alert representation returned by `GET /v1/alerts/{id}`.
        Supersets `Alert` with full description, instruction, geometry,
        spatial metadata (centroid, recommended zoom, affected
        population), and the upstream NWS VTEC identifier.

        Field shape mirrors `wx-api`'s `GET /v1/alerts/{id}` so iOS,
        legacy CRA, and OG-service consumers swap base URLs without
        parsing changes.
      required:
        - group_id
        - message_id
        - status
        - event
        - severity
        - urgency
        - certainty
        - headline
        - sender
        - effective
        - expires
        - onset
        - ends
        - expiration
      properties:
        group_id:
          type: string
          description: Canonical primary key on the alerts table.
          example: "1.2.3-NWS-WW.SAMPLE.CASE"
        message_id:
          type: string
          description: NWS-issued message identifier (matches `Alert.id`).
          example: "1.2.3-NWS-WW.SAMPLE.CASE"
        status:
          type: string
          description: Alert lifecycle status (e.g., `Actual`, `Exercise`, `Test`).
        event:
          type: string
          example: "Severe Thunderstorm Warning"
        severity:
          type: string
          enum: [Extreme, Severe, Moderate, Minor, Unknown]
        urgency:
          type: string
          enum: [Immediate, Expected, Future, Past, Unknown]
        certainty:
          type: string
          enum: [Observed, Likely, Possible, Unlikely, Unknown]
        headline:
          type: string
        description:
          type: string
          description: |
            Multi-paragraph human-readable forecast / hazard
            description. Line endings vary by NWS office; clients
            should treat as opaque text.
        instruction:
          type: string
          description: Recommended actions (NWS-issued instruction text).
        sender:
          type: string
          description: Issuing NWS office identifier.
        effective:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
        onset:
          type: string
          format: date-time
        ends:
          type: string
          format: date-time
        expiration:
          type: string
          format: date-time
          description: Final expiration time used for cache invalidation.
        area_desc:
          type: string
          description: Human-readable affected area.
        highlights:
          type: object
          additionalProperties:
            type: string
          description: |
            Map of salient callouts extracted from the alert text
            (e.g., `{"hazard": "Strong winds", "impact": "Loose debris possible"}`).
        geometry:
          type: object
          description: |
            GeoJSON geometry (Polygon / MultiPolygon) for the affected
            area when stored upstream. Treat as opaque GeoJSON;
            forward-compat fields the pipeline adds without a sw-api
            release pass through unchanged.
          additionalProperties: true
        centroid_lat:
          type: number
          format: double
          description: Centroid latitude of the affected geometry.
        centroid_lon:
          type: number
          format: double
          description: Centroid longitude of the affected geometry.
        recommended_zoom:
          type: integer
          description: Suggested map zoom level when rendering the alert detail.
        affected_population:
          type: integer
          description: Estimated population intersecting the alert geometry.
        timezone:
          type: string
          description: IANA timezone of the affected area (e.g., `America/Chicago`).
        vtec_id:
          type: string
          description: |
            Upstream NWS VTEC identifier (when present). Useful for
            joining against external VTEC datasets; `null` for alerts
            without a VTEC code.
        event_ending_time:
          type: string
          description: |
            Optional ending-time hint surfaced by the OG-share image
            renderer. Currently always omitted by the pipeline; clients
            should fall back to `expires`. Reserved for forward-compat.

    Outlook:
      type: object
      description: |
        Single SPC convective outlook (or equivalent product) active for
        the location.
      required: [product_id, type, day, risk_label, valid, expires]
      properties:
        product_id:
          type: string
          description: Upstream product identifier (e.g., `spc_otlk_day1`).
          example: "spc_otlk_day1"
        type:
          type: string
          description: Hazard category (`severe`, `tornado`, `hail`, `wind`, etc.).
          example: "severe"
        day:
          type: integer
          minimum: 1
          maximum: 8
          description: Day number relative to issuance (1 = today).
        risk:
          type: string
          description: Raw risk identifier from the upstream source.
        probability:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Fractional probability (0-1) when the source provides one.
        risk_label:
          type: string
          description: Human-readable risk label.
          example: "Slight"
        valid:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
        significant:
          type: boolean
          description: |
            The location falls inside SPC's hatched significant-severe
            area for this hazard — tornadoes of EF2+, hail 2 in or
            larger, or wind gusts of 65 kt or more.

            SPC ships this as its own polygon, so it is reported here as
            a flag on the hazard it qualifies rather than as a separate
            entry. Absent (or `false`) outside the hatched area.

    OutlookDetail:
      type: object
      description: |
        Drill-down detail for one SPC convective outlook day at a
        location: the categorical risk band, each probabilistic hazard,
        and the forecaster's written discussion.

        Everything except `day` is optional. A point can sit inside a
        categorical polygon with no probabilistic coverage, and the
        narrative is ingested separately from the polygons so it can lag
        a fresh issuance.
      required: [day, probabilities]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 8
          description: The outlook day this detail describes (1 = today).
        categorical:
          $ref: '#/components/schemas/Outlook'
        dry_thunderstorm:
          allOf:
            - $ref: '#/components/schemas/Outlook'
          description: |
            The SPC dry-thunderstorm fire band (`IDRT` isolated or `SDRT`
            scattered), present only for `hazard=fire`.

            SPC draws two independent fire criteria per day and publishes
            each as its own layer: the wind/RH criterion
            (`elevated`/`critical`/`extremely critical`) in `categorical`,
            and the lightning-ignition criterion here. Either can have
            areas on a day the other has none, and both can cover one
            point, so read them as separate criteria rather than tiers of
            one scale -- a scattered dry thunderstorm area is not "worse
            than" an extremely critical one.
        probabilities:
          type: array
          description: |
            One entry per probabilistic hazard covering the point. Days
            1-2 break these out as `tornado`, `wind`, and `hail`; day 3
            and beyond issue a single combined `probabilistic` product.
            Empty when no probabilistic polygon covers the location.
            Categorical bands never appear here.
          items:
            $ref: '#/components/schemas/Outlook'
        narrative:
          $ref: '#/components/schemas/OutlookNarrative'

    OutlookNarrative:
      type: object
      description: |
        The SPC forecaster's written discussion for an outlook day, as
        issued in the corresponding SWO text product.
      properties:
        awips_id:
          type: string
          description: |
            AWIPS identifier of the source product — `SWODY1`, `SWODY2`,
            `SWODY3` for the single-day outlooks, `SWOD48` for days 4-8.
          example: "SWODY1"
        issued_at:
          type: string
          format: date-time
        body:
          type: string
          description: Full narrative text as written by the forecaster.
        summary:
          type: string
          description: Short generated summary, when one is available.

    StormTracksFeatureCollection:
      type: object
      description: |
        GeoJSON FeatureCollection of active storm-cell tracks. Returned
        as `application/geo+json` from `GET /v1/storm-tracks`.

        The schema below documents the stable subset of the wire
        format. The reader pipeline may add new keys to
        `properties` (e.g. richer `impact.*` sub-objects, additional
        cell-classification fields) without a sw-api release; clients
        should treat unknown keys as opaque additive data and never
        fail-closed on their presence.
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/StormTrackFeature'
      additionalProperties: true

    StormReportsFeatureCollection:
      type: object
      description: |
        GeoJSON FeatureCollection of recent NWS local storm reports.
        Returned as `application/geo+json` from `GET /v1/storm-reports`.

        The reader pipeline emits at minimum a `valid_time` field on
        each feature's `properties`; additional event-type-specific
        keys (magnitude, narrative, county, etc.) may appear without a
        sw-api release. Treat unknown keys as opaque additive data.
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/GeoJSONReportsFeature'
      additionalProperties: true

    RecordEventsFeatureCollection:
      type: object
      description: |
        GeoJSON FeatureCollection of NWS climate-record events
        (record high / low temperatures, daily precipitation records,
        etc.). Returned as `application/geo+json` from
        `GET /v1/record-events`. Same forward-compat property-bag
        contract as `StormReportsFeatureCollection`.
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/GeoJSONReportsFeature'
      additionalProperties: true

    NexradFeaturesFeatureCollection:
      type: object
      description: |
        GeoJSON FeatureCollection of NEXRAD Level III algorithm-detection
        overlays (Hail Index / Mesocyclone / TVS). Returned as
        `application/geo+json` from `GET /v1/nexrad/features`.

        Each feature carries `site_id` plus product-specific detection
        fields in a forward-compat `properties` bag; clients should treat
        unknown keys as opaque additive data and never fail-closed on
        their presence.
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/GeoJSONOpaqueFeature'
      additionalProperties: true

    TropicalFeatureCollection:
      type: object
      description: |
        GeoJSON FeatureCollection aggregating the latest NHC tropical
        overlay (cone / track / points / watch-warning per active storm
        plus 7-day TWO areas). Returned as `application/geo+json` from
        `GET /v1/tropical`. Each feature carries a `kind` property the
        client uses to choose its renderer; the property bag is
        forward-compat.
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/GeoJSONOpaqueFeature'
      additionalProperties: true

    GeoJSONOpaqueFeature:
      type: object
      description: |
        Generic GeoJSON Feature with opaque geometry and a forward-compat
        property bag. Used by overlays (NEXRAD detections, tropical) whose
        per-feature property schema is owned by the reader pipeline and
        may evolve without a sw-api release. Treat `geometry` and all
        `properties` keys as opaque additive data.
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        geometry:
          type: object
          description: |
            GeoJSON geometry (Point / LineString / Polygon / Multi*).
            Treat as opaque GeoJSON; pass through to the renderer
            unchanged.
          additionalProperties: true
        properties:
          type: object
          additionalProperties: true
      additionalProperties: true

    GeoJSONReportsFeature:
      type: object
      description: |
        Shared per-feature shape used by `StormReportsFeatureCollection`
        and `RecordEventsFeatureCollection`. The reader emits
        `geometry` as opaque GeoJSON (typically `Point`) and a
        `properties` bag whose only stable key is `valid_time`.
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        geometry:
          type: object
          description: |
            GeoJSON geometry (typically `Point`). Treat as opaque
            GeoJSON; pass through to the renderer unchanged.
          additionalProperties: true
        properties:
          $ref: '#/components/schemas/GeoJSONReportsProperties'
      additionalProperties: true

    GeoJSONReportsProperties:
      type: object
      description: |
        Per-feature property bag emitted by the storm-reports +
        record-events pipelines. `valid_time` is the only stable key;
        additional keys may appear without a sw-api release
        (forward-compat).
      required: [valid_time]
      properties:
        valid_time:
          type: string
          format: date-time
          description: |
            UTC timestamp the report / record was observed or recorded.
      additionalProperties: true

    ReverseGeocodeResponse:
      type: object
      description: |
        Resolved place metadata for a `(lat, lon)` query against
        `GET /v1/geocode/reverse`. All fields are best-effort: `city`
        is populated when the coordinate falls inside a populated-place
        polygon; `nearest_city` is populated when the coordinate is
        outside any city polygon but within the resolution radius of
        one. `state` carries the canonical NWS region label.

        Forward-compat: additional fields may appear in this object
        without a sw-api release.
      properties:
        city:
          type: string
          description: |
            Populated-place name when the query coordinate falls inside
            a city polygon. Empty when only `nearest_city` is set.
          example: "Chicago"
        nearest_city:
          type: string
          description: |
            Closest populated-place name when the query coordinate is
            outside any city polygon. Empty when `city` is set.
          example: "Naperville"
        state:
          type: string
          description: |
            Canonical NWS state / region label (e.g. "Illinois",
            "Puerto Rico").
          example: "Illinois"
        county:
          type: string
          description: |
            County or equivalent admin-2 area, when available.
          example: "Cook"
        timezone:
          type: string
          description: |
            IANA timezone identifier covering the query coordinate.
          example: "America/Chicago"
      additionalProperties: true

    GeocodeResultsResponse:
      type: object
      description: |
        Envelope returned by `GET /v1/geocode/autosuggest` and
        `GET /v1/geocode/search`. The `results` array is the only
        stable key; additional sibling fields may appear without a
        sw-api release (e.g. server-side annotations).

        An empty array is returned when no candidates match.
      required: [results]
      properties:
        results:
          type: array
          description: Match candidates, ordered by reader-side score.
          items:
            $ref: '#/components/schemas/GeocodeAutosuggestResult'
      additionalProperties: true

    GeocodeAutosuggestResult:
      type: object
      description: |
        Single forward-geocode candidate. Field shape mirrors the
        reader's `AutosuggestResult` (most fields are nullable JSON
        nulls when the underlying row lacks the column). `type` is
        the reader's discriminator (`city`, `zip`, etc.).

        Forward-compat: additional fields may appear without a
        sw-api release.
      properties:
        name:
          type: [string, "null"]
          description: Populated-place name.
          example: "Chicago"
        state:
          type: [string, "null"]
          description: 2-letter US state code.
          example: "IL"
        state_name:
          type: [string, "null"]
          description: Full state / region label.
          example: "Illinois"
        county:
          type: [string, "null"]
          description: County or equivalent admin-2 area.
          example: "Cook"
        zip:
          type: [string, "null"]
          description: Representative ZIP for the place (or query ZIP for ZIP search).
          example: "60601"
        lat:
          type: [number, "null"]
          format: double
          description: Centroid latitude in decimal degrees.
          example: 41.8781
        lon:
          type: [number, "null"]
          format: double
          description: Centroid longitude in decimal degrees.
          example: -87.6298
        population:
          type: [integer, "null"]
          description: Population estimate, when known.
          example: 2746388
        timezone:
          type: [string, "null"]
          description: IANA timezone identifier covering the centroid.
          example: "America/Chicago"
        type:
          type: string
          description: |
            Reader-side discriminator. Currently emitted values
            include `city`, `zip`. Treat as opaque -- new types may
            appear without a sw-api release.
          example: "city"
      additionalProperties: true

    StormTrackFeature:
      type: object
      description: |
        Single storm-cell GeoJSON Feature. `geometry` is the projected
        track polyline; `properties` carries per-cell metadata.
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        geometry:
          type: object
          description: |
            GeoJSON geometry (typically `LineString` or `MultiLineString`).
            Treat as opaque GeoJSON; pass through to the renderer
            unchanged.
          additionalProperties: true
        properties:
          $ref: '#/components/schemas/StormTrackProperties'
      additionalProperties: true

    StormTrackProperties:
      type: object
      description: |
        Per-cell property bag emitted by the storm-tracks pipeline.
        Stable keys are listed below; additional keys may appear
        without a sw-api release (forward-compat).
      required: [cell_id, site_id]
      properties:
        cell_id:
          type: string
          description: Pipeline-assigned cell identifier (stable across scans).
          example: "A1"
        site_id:
          type: string
          description: 3-letter NEXRAD radar site code that produced the cell.
          example: "TLX"
        scan_time:
          type: string
          format: date-time
          description: Radar scan timestamp the cell was observed at.
        valid_time:
          type: string
          format: date-time
          description: |
            Forecast valid-time (extrapolated). May equal `scan_time`
            for cells without an extrapolation.
        impact:
          type: object
          description: |
            Optional impact metadata. Populated only when the request
            included `detailed=true`. Property bag is forward-compat:
            new fields may appear without a sw-api release.
          additionalProperties: true
      additionalProperties: true

    Astro:
      type: object
      description: Astronomical data for the requested location and date.
      required: [day_length, daylight_length, moon_phase, moon_phase_name, moon_illumination]
      properties:
        civil_dawn:
          type: [string, "null"]
          format: date-time
        sunrise:
          type: [string, "null"]
          format: date-time
        solar_noon:
          type: [string, "null"]
          format: date-time
        sunset:
          type: [string, "null"]
          format: date-time
        civil_dusk:
          type: [string, "null"]
          format: date-time
        day_length:
          type: integer
          minimum: 0
          description: Seconds from sunrise to sunset.
        daylight_length:
          type: integer
          minimum: 0
          description: Seconds from civil dawn to civil dusk.
        moonrise:
          type: [string, "null"]
          format: date-time
          description: Null when no moonrise occurs on this date.
        moonset:
          type: [string, "null"]
          format: date-time
          description: Null when no moonset occurs on this date.
        moon_phase:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Moon phase (0 = new, 0.5 = full, 1 = new).
        moon_phase_name:
          type: string
          enum:
            - "New Moon"
            - "Waxing Crescent"
            - "First Quarter"
            - "Waxing Gibbous"
            - "Full Moon"
            - "Waning Gibbous"
            - "Last Quarter"
            - "Waning Crescent"
        moon_illumination:
          type: number
          format: double
          minimum: 0
          maximum: 1

    # -----------------------------------------------------------------------
    # GIS (scoped down), units, attribution, meta
    # -----------------------------------------------------------------------

    GIS:
      type: object
      description: |
        Geographic metadata for the resolved location. Contains coordinate
        data, political boundaries, population, timezone, and nearest
        NEXRAD radar site metadata.

        Radar data URLs (wx-pipeline visual-products manifest, NEXRAD
        ledger URLs) are **not** returned in the Phase 2 v1 response; they
        require a public-CDN authentication model that is still being
        designed. `/v1/radar/*` endpoints will land in Phase 5.
      required: [lat, lon, timezone]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
        city:
          type: string
          description: City name covering the point (if the point lies inside city limits).
        nearest_city:
          type: string
          description: Nearest named city (useful when `city` is not populated).
        state:
          type: string
          description: State or equivalent subdivision (abbreviation).
        county:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        population:
          type: [integer, "null"]
          minimum: 0
          description: Approximate population of `city` or `nearest_city`.
        timezone:
          type: string
          description: IANA timezone identifier.
        nearest_radar:
          $ref: '#/components/schemas/NearestRadar'
        nearest_station:
          $ref: '#/components/schemas/NearestStation'

    NearestStation:
      type: object
      description: Metadata for the nearest METAR observation station.
      required: [id, lat, lon, distance_km]
      properties:
        id:
          type: string
          description: ICAO station identifier (e.g., `KJFK`).
          example: "KJFK"
        name:
          type: string
        state:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        distance_km:
          type: number
          format: double
          minimum: 0
        elevation_m:
          type: [number, "null"]

    NearestRadar:
      type: object
      description: |
        Metadata for the nearest NEXRAD radar site. Data URLs are not
        included here; Phase 5 `/v1/radar/*` endpoints will return the
        URL contract.
      required: [id, name, lat, lon, distance_km]
      properties:
        id:
          type: string
          description: Radar site code without ICAO prefix (e.g., `LOT`, `OKX`, `AKC`).
          example: "BOX"
        name:
          type: string
          example: "Boston"
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
        distance_km:
          type: number
          format: double
          minimum: 0

    Units:
      type: object
      description: |
        Unit labels for the numeric fields in this response. The exact
        label set is determined by the `units` request parameter.
      required: [temperature, wind_speed, pressure, visibility, precip_amount]
      properties:
        temperature:
          type: string
          enum: ["F", "C"]
          description: Temperature unit.
        wind_speed:
          type: string
          enum: ["mph", "kph"]
        pressure:
          type: string
          enum: ["inHg", "hPa"]
        visibility:
          type: string
          enum: ["mi", "km"]
        precip_amount:
          type: string
          enum: ["in", "mm"]
        altitude:
          type: string
          enum: ["m", "ft"]
          description: Unit for altitude-dimensioned fields (snow_level, cloud_ceiling).
        solar_radiation:
          type: string
          enum: ["W/m^2"]
          description: Unit for irradiance fields (currently always `W/m^2`).

    Attribution:
      type: object
      description: |
        Attribution for the data sources that contributed to this response.
        `sources` is an explicit list of canonical identifiers suitable
        for compliance checklists; `notice` is a human-readable catch-all
        covering licensing / credit language.
      required: [sources, notice]
      properties:
        sources:
          type: array
          description: Canonical source identifiers that contributed data.
          items:
            type: string
          example:
            - "NOAA NBM"
            - "HRRR"
            - "RTMA"
            - "MRMS"
            - "NWS"
            - "JPL Ephemeris"
        notice:
          type: string
          description: Human-readable attribution notice.
          example: "Weather data from NOAA/NWS. Astronomical calculations from JPL ephemerides."

    Meta:
      type: object
      description: |
        Per-response metadata: response schema version, generation time,
        upstream data freshness, and any non-fatal warnings.
      required: [schema_version, generated_at]
      properties:
        schema_version:
          type: string
          description: |
            Response schema version, emitted as an ISO 8601 date. Increments
            on every non-additive change. SDKs and caches can use this as a
            stable cache key for response shape.
          example: "2026-04-20"
        generated_at:
          type: string
          format: date-time
          description: Server time at which this response body was generated.
        freshness:
          type: array
          description: Freshness metadata for each upstream data source used.
          items:
            $ref: '#/components/schemas/SourceFreshness'
        warnings:
          type: array
          description: |
            Non-fatal warnings generated during request fulfillment. Each
            entry has a stable `code` clients can branch on and a
            human-readable `detail`.
          items:
            $ref: '#/components/schemas/MetaWarning'

    MetaWarning:
      type: object
      required: [code, section]
      properties:
        code:
          type: string
          description: |
            Stable machine-parseable warning code. Clients should branch on
            `code`, not on `detail`. Additive set; new codes may be added
            without a breaking-change announcement.
          enum:
            - partial_fetch
            - upstream_timeout
            - upstream_unavailable
            - coverage_limited
            - geocode_ambiguous
            - stale_response
          example: "partial_fetch"
        section:
          type: string
          description: |
            Response section the warning applies to (e.g., `"alerts"`,
            `"hourly"`, `"outlooks"`). May also be `"_request"` for
            request-level warnings.
          example: "alerts"
        detail:
          type: string
          description: Human-readable explanation.

    SourceFreshness:
      type: object
      description: Freshness metadata for a single upstream data source.
      required: [source, product_id, age_seconds]
      properties:
        source:
          type: string
          description: Source family (e.g., `rtma`, `hrrr`, `nbm`, `mrms`).
          example: "rtma"
        product_id:
          type: string
          description: Specific product identifier.
          example: "rtma_conus_2p5km"
        reference_time:
          type: [string, "null"]
          format: date-time
          description: Model run / observation reference time.
        latest_valid:
          type: [string, "null"]
          format: date-time
          description: Latest valid time represented in the source.
        age_seconds:
          type: integer
          minimum: 0
          description: Seconds elapsed since `reference_time`.

    # -----------------------------------------------------------------------
    # Experimental: narrations + guidance
    # -----------------------------------------------------------------------

    Narrations:
      type: object
      x-stability: experimental
      description: |
        Rule-based narrative text for current and short-term conditions,
        generated deterministically from the blended forecast (not an LLM).

        **Experimental.** Field shapes and prose styling may change during
        Phase 2 closed beta without notice; the 90-day breaking-change
        commitment applies at general availability per ADR 001.
      properties:
        current:
          type: string
          description: |
            Time-of-day-aware summary of current conditions. Weaves in, when
            available, a category- and time-aware alert cue (e.g. "Elevated
            fire-weather conditions through 1 AM."), imminent-precip nowcast, the
            current observation, the next-few-hours trend, and a time-aware
            high/low (today's high during the day; tonight's low and tomorrow's
            high in the evening). Phrasing varies by location and hour for natural
            variety but is stable between refreshes within the hour. Temperatures
            follow the requested `units`. Requires `current` data; `daily` adds
            the high/low, `alerts` the alert cue, and `nowcast` the
            imminent-precip cue.
        short_term:
          type: string
          description: Narrative covering the next few hours.

    Guidance:
      type: object
      x-stability: experimental
      description: |
        Distilled data from NWS forecaster text products (AFD, HWO, SWO,
        MCD). Structured summaries rather than raw text.

        **Experimental.** Field shapes may change during Phase 2 closed
        beta without notice; the 90-day breaking-change commitment applies
        at general availability per ADR 001.
      required: [active_mcds]
      properties:
        afd:
          $ref: '#/components/schemas/AFDGuidance'
        hwo:
          $ref: '#/components/schemas/HWOGuidance'
        active_mcds:
          type: integer
          minimum: 0
          description: Count of active SPC Mesoscale Convective Discussions overlapping the location.
        swo_day1_risk:
          type: string
          description: SPC Day-1 convective outlook categorical risk label (when active).

    AFDGuidance:
      type: object
      x-stability: experimental
      description: Structured Area Forecast Discussion summary.
      properties:
        synopsis:
          type: string
        key_takeaway:
          type: string
        confidence:
          type: string
          description: Forecaster-stated confidence level (free text).
        issued_at:
          type: [string, "null"]
          format: date-time
        wfo:
          type: string
          description: Issuing Weather Forecast Office identifier.

    HWOGuidance:
      type: object
      x-stability: experimental
      description: Structured Hazardous Weather Outlook summary.
      required: [has_active_hazards]
      properties:
        day_one:
          type: string
          description: Day-one hazard summary text.
        has_active_hazards:
          type: boolean
        issued_at:
          type: [string, "null"]
          format: date-time

    # -----------------------------------------------------------------------
    # POST /v1/weather/batch
    # -----------------------------------------------------------------------

    WeatherBatchRequest:
      type: object
      description: |
        Multi-location request body. `locations[]` is required and capped
        at 25 entries. The remaining fields are shared parameters applied
        to every location.
      required: [locations]
      properties:
        locations:
          type: array
          minItems: 1
          maxItems: 25
          description: |
            Locations to fetch in this batch. Order is preserved on the
            corresponding `results[]` array.
          items:
            $ref: '#/components/schemas/WeatherBatchLocation'
        include:
          type: string
          description: |
            Same semantics as the `include` query parameter on
            `GET /v1/weather`. Applied to every location.
          example: "current,daily,alerts"
        units:
          type: string
          enum: [imperial, metric]
          default: imperial
          description: Same semantics as the `units` query parameter on `GET /v1/weather`.
        days:
          type: integer
          minimum: 1
          maximum: 14
          default: 10
          description: Same semantics as the `days` query parameter on `GET /v1/weather`.
        hourly_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 48
          description: Same semantics as the `hourly_hours` query parameter on `GET /v1/weather`.

    WeatherBatchLocation:
      type: object
      description: |
        A single location selector. Exactly one of (`lat` + `lon`),
        `zip`, or `location` must be provided. Mixing selectors in one
        entry, or omitting all of them, fails that row only.
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude. Required together with `lon`.
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude. Required together with `lat`.
        zip:
          type: string
          pattern: '^\d{5}$'
          description: 5-digit US ZIP code.
        location:
          type: string
          minLength: 1
          maxLength: 128
          description: Free-text location name.

    WeatherBatchResponse:
      type: object
      description: |
        Batch response. `results[i]` corresponds to `locations[i]` from
        the request body and carries either `weather` (a full F2 weather
        payload) or `error` (a structured per-location failure).
      required: [results, meta]
      properties:
        results:
          type: array
          description: One entry per input location, in input order.
          items:
            $ref: '#/components/schemas/WeatherBatchResult'
        meta:
          $ref: '#/components/schemas/Meta'

    WeatherBatchResult:
      type: object
      description: |
        A single batch entry. Exactly one of `weather` or `error` is set.
        Section-level partial failures inside a successfully resolved
        location surface as `weather.meta.warnings[]`, exactly as for
        `GET /v1/weather`.
      required: [index]
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based index into the original `locations[]` array.
        weather:
          $ref: '#/components/schemas/Weather'
        error:
          $ref: '#/components/schemas/WeatherBatchError'

    WeatherBatchError:
      type: object
      description: Structured per-location error envelope inside a batch response.
      required: [index, code, message]
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based index into the original `locations[]` array.
        input:
          $ref: '#/components/schemas/WeatherBatchLocation'
          description: Echo of the failing input row, for client correlation.
        code:
          type: string
          description: Stable machine-parseable error code.
          enum:
            - invalid_input
            - location_not_found
            - upstream_unavailable
            - upstream_timeout
            - internal_error
        message:
          type: string
          description: Human-readable explanation. Stable for logging; clients should branch on `code`.

    # -----------------------------------------------------------------------
    # Agriculture — Growing Degree Units (GDU / GDD)
    # -----------------------------------------------------------------------

    GddThresholds:
      type: object
      description: Resolved GDU thresholds, always expressed in °C.
      required: [base_temp_c]
      properties:
        base_temp_c:
          type: number
          format: double
          description: Base (lower) temperature threshold in °C.
        upper_temp_c:
          type: number
          format: double
          description: Upper cutoff in °C (present only for the modified method).

    GddGap:
      type: object
      description: A run of missing observed days affecting a cumulative total.
      required: [start, end, days, filled]
      properties:
        start:
          type: string
          format: date
          description: First missing day (inclusive).
        end:
          type: string
          format: date
          description: Last missing day (inclusive).
        days:
          type: integer
          description: Number of missing days in the run.
        filled:
          type: string
          description: |
            How the gap was handled, e.g. `interpolated` (short gap filled
            from adjacent days) or `unfilled` (long gap surfaced, not
            silently under-counted).

    GddMeta:
      type: object
      description: Provenance for a GDU response. Nothing is silently assumed.
      required: [day_definition, computation_path, source, unit]
      properties:
        day_definition:
          type: string
          enum: [nws, local_calendar]
          description: The daily boundary used.
        computation_path:
          type: string
          description: |
            How the series was assembled (e.g. forecast-only vs. stitched
            observed + partial + forecast), for grid-vs-point transparency.
        source:
          type: string
          description: Backing product mix (NBM / RTMA) used for this answer.
        freshness:
          type: string
          description: Human-readable data-age hint, when available.
        unit:
          type: string
          enum: [imperial, metric]
          description: Unit system applied to numeric GDU + temperature fields.
        approximate:
          type: boolean
          description: True when gaps were interpolated or coverage was partial.
        gaps:
          type: array
          description: Missing-day runs affecting a cumulative total.
          items:
            $ref: '#/components/schemas/GddGap'

    GddDay:
      type: object
      description: One day of GDU output.
      required: [date, gdu]
      properties:
        date:
          type: string
          format: date
          description: Local calendar date for this day.
        gdu:
          type: number
          format: double
          description: GDU accrued on this day, in the requested unit.
        tmax_c:
          type: number
          format: double
          description: Daily maximum temperature in °C (metric responses).
        tmin_c:
          type: number
          format: double
          description: Daily minimum temperature in °C (metric responses).
        tmax_f:
          type: number
          format: double
          description: Daily maximum temperature in °F (imperial responses).
        tmin_f:
          type: number
          format: double
          description: Daily minimum temperature in °F (imperial responses).
        cumulative_gdu:
          type: number
          format: double
          description: |
            Running season-to-date total through this day. Present only in
            cumulative mode (when `season_start` was supplied).
        missing:
          type: boolean
          description: True when the underlying day had no temperature data.
        interpolated:
          type: boolean
          description: True when this day's value was interpolated across a gap.

    GddMilestone:
      type: object
      description: |
        A crop growth-stage GDU hint from the catalog. Interpretation aid for
        clients; not a server-computed threshold.
      required: [stage, gdu]
      properties:
        stage:
          type: string
          description: Growth-stage label (e.g. `emergence`, `silking`).
        gdu:
          type: number
          format: double
          description: Cumulative GDU (requested unit) at which the stage is reached.

    PointValue:
      type: object
      description: |
        A single allowlisted value sampled at a point, with friendly metadata.
        The single-form wire shape for GET /v1/point (scalar or zone).
      required: [product, var, value, approximate]
      properties:
        product:
          type: string
          description: Echoed product identifier.
          example: sport_rsm_0_2m_pct_conus
        var:
          type: string
          description: Echoed variable identifier.
          example: rsm_0_2m_pct
        value:
          type: [number, "null"]
          format: double
          description: |
            The sampled value in `unit` (scalar), or the ordinal level of the
            containing band (zone). `null` when a zone point is in no band
            (`category: "none"`).
          example: 34.2
        unit:
          type: string
          description: Canonical unit of `value` (clients convert for display).
          example: percentile
        category:
          type: string
          description: |
            Optional human category the value falls into (e.g. soil-moisture
            `dry`/`normal`/`moist`, or an outlook band like `slight`). The
            explicit value `"none"` means a zone point is in no band. Omitted
            for scalars without categories.
          example: dry
        label:
          type: string
          description: |
            Optional human display label for a named band (e.g. `Slight`,
            `Elevated`). Omitted for plain scalars.
          example: Slight
        observed_at:
          type: string
          format: date-time
          description: Valid time of the sampled value / outlook.
          example: "2026-06-30T12:00:00Z"
        approximate:
          type: boolean
          description: |
            True when the value is older than the product's update cadence
            allows (stale).
          example: false
        status:
          type: string
          description: |
            Outcome of the point query. `ok` when a value is present;
            `unavailable` when no sample exists at the location (within domain).
          enum: [ok, unavailable]
          example: ok

    PointValueItem:
      type: object
      description: |
        One resolved value within a PointBatchResponse. Superset of PointValue
        with a per-item `status` so a single unavailable/out-of-domain value
        does not fail the whole request.
      required: [product, var, approximate, status]
      properties:
        product:
          type: string
          description: Echoed product identifier.
          example: spc_day1_categorical
        var:
          type: string
          description: Echoed variable identifier.
          example: risk
        value:
          type: [number, "null"]
          format: double
          description: |
            The sampled value / band ordinal. Omitted for non-`ok` items and
            `null`/omitted for a zone point in no band.
          example: 2
        unit:
          type: string
          description: Canonical unit of `value` (clients convert for display).
          example: mm
        category:
          type: string
          description: |
            Human category (or `"none"` for a zone point in no band). Omitted
            when not applicable.
          example: slight
        label:
          type: string
          description: Human display label for a named band. Omitted otherwise.
          example: Slight
        observed_at:
          type: string
          format: date-time
          description: Valid time of the sampled value / outlook.
          example: "2026-07-01T12:00:00Z"
        approximate:
          type: boolean
          description: True when the value is stale for its cadence.
          example: false
        status:
          type: string
          description: |
            Per-item outcome. `ok` — resolved (a zone `"none"` is still `ok`).
            `not_allowlisted` — the selector is not curated. `out_of_domain` —
            the point is outside the product's coverage. `unavailable` — no data
            at the point.
          enum: [ok, not_allowlisted, out_of_domain, unavailable]
          example: ok

    PointBatchResult:
      type: object
      description: All requested values at one location.
      required: [lat, lon, values]
      properties:
        lat:
          type: number
          format: double
          description: Echoed latitude of the requested point.
          example: 41.9
        lon:
          type: number
          format: double
          description: Echoed longitude of the requested point.
          example: -93.6
        values:
          type: array
          description: One item per requested selector, in request order.
          items:
            $ref: '#/components/schemas/PointValueItem'

    PointBatchResponse:
      type: object
      description: |
        The batch-form wire shape for GET /v1/point: per-point, per-selector
        values. Returned when `select` and/or `points` is provided.
      required: [results]
      properties:
        results:
          type: array
          description: One entry per requested point, in request order.
          items:
            $ref: '#/components/schemas/PointBatchResult'

    GrowingDegreeDays:
      type: object
      description: Growing Degree Units for a point, forecast or season-cumulative.
      required: [crop, catalog_version, method, thresholds, meta, days]
      properties:
        crop:
          type: string
          description: Echoed crop id (`corn`, ..., or `custom`).
        catalog_version:
          type: integer
          description: Version of the crop catalog used to resolve thresholds.
        method:
          type: string
          enum: [simple, modified]
          description: GDU method applied.
        thresholds:
          $ref: '#/components/schemas/GddThresholds'
        meta:
          $ref: '#/components/schemas/GddMeta'
        days:
          type: array
          description: Per-day GDU series (chronological).
          items:
            $ref: '#/components/schemas/GddDay'
        cumulative_total:
          type: number
          format: double
          description: |
            Season-to-date GDU total in the requested unit. Present only in
            cumulative mode (when `season_start` was supplied), and omitted
            even then when `meta.gaps` contains an `unfilled` span: those days
            have no observed data, so the sum would under-count the season.
            Treat an absent total on a `season_start` request as "season total
            unavailable" and fall back to the per-day series, which is still
            good for the days it covers. `meta.gaps` names the window that was
            lost.
        milestones:
          type: array
          description: |
            Crop growth-stage GDU hints, present when `include_milestones=true`
            and the crop has catalog milestones.
          items:
            $ref: '#/components/schemas/GddMilestone'

    ClimateNormalsStation:
      type: object
      description: |
        The station a normals series was drawn from. Normals describe this
        station, not necessarily the point you asked about.
      required: [station_id, latitude, longitude, distance_km]
      properties:
        station_id:
          type: string
          description: GHCN station identifier.
          example: USW00094728
        name:
          type: string
          description: Station name as published by NCEI.
          example: NEW YORK CNTRL PK
        state:
          type: string
          description: Two-letter state or territory code.
          example: NY
        latitude:
          type: number
          format: double
          description: Station latitude.
          example: 40.7789
        longitude:
          type: number
          format: double
          description: Station longitude.
          example: -73.9692
        elevation_m:
          type: number
          format: double
          description: |
            Station elevation in metres. Worth comparing against your point:
            an elevation difference biases normals more than distance does.
          example: 42.7
        distance_km:
          type: number
          format: double
          description: |
            Great-circle distance from the requested point to the station.
            The single number that says how much to trust this series.
          example: 3.4

    ClimateNormalsMeta:
      type: object
      description: Provenance for a normals response.
      required: [source, unit]
      properties:
        normals_period:
          type: string
          description: Base period the normals were computed over.
          example: "1991-2020"
        source:
          type: string
          description: |
            Where the values came from: `station` for the NCEI station
            product, `grid` for gridded normals, `mixed` when a series draws
            on both.
          example: station
        normals_method:
          type: string
          enum: [official, derived]
          description: |
            How the normals were produced, which `source` does not answer.
            `official` means the provider publishes them as a normals product
            -- true of both the NCEI station normals and the NCEI gridded
            normals, so a station/grid mix is still wholly official.
            `derived` means they were computed from raw climate data, which is
            a weaker claim a client should qualify. Absent when upstream does
            not report it.
          example: official
        unit:
          type: string
          enum: [imperial, metric]
          description: |
            Unit system applied to the values: °F and inches for `imperial`,
            °C and millimetres for `metric`.
        approximate:
          type: boolean
          description: |
            True when a station more than 50 km away supplied values that are
            actually being served — `station.distance_km` says how far.

            It is not a plain distance test. A `grid` day is the requested
            point's own normal, so no station distance makes it approximate,
            and a series whose `source` is `grid` is never flagged however far
            the named station sits. A `mixed` series is flagged, because the
            station-sourced days in it genuinely are approximations.
        missing_days:
          type: integer
          description: |
            How many days in the requested range no normal is available for,
            from either the grid or the station. Those days are still present
            in `days` with their temperature fields omitted.

    ClimateNormalsDay:
      type: object
      description: |
        One day-of-year slice. Fields are omitted when no normal is available,
        which is not the same as a value of zero. `normal_precip` is
        additionally omitted on any station-sourced day — see its description.
      required: [date, month, day]
      properties:
        date:
          type: string
          format: date
          description: Calendar date this slice was requested for.
          example: "2026-07-28"
        month:
          type: integer
          description: Month of the day-of-year slice (1-12).
          example: 7
        day:
          type: integer
          description: Day of month (1-31).
          example: 28
        normal_high:
          type: number
          format: double
          description: Average daily maximum temperature.
          example: 84.2
        normal_low:
          type: number
          format: double
          description: Average daily minimum temperature.
          example: 69.8
        normal_mean:
          type: number
          format: double
          description: Average daily mean temperature.
          example: 77.0
        normal_high_stddev:
          type: number
          format: double
          description: |
            Standard deviation of the daily maximum. An interval, so it scales
            without the freezing-point offset: 3 °C of spread is 5.4 °F.

            Always from the nearest station, including on a day whose
            temperatures came from the grid — the gridded normals publish no
            standard deviations. On such a day the temperatures describe your
            point while this describes the named station, so read
            `station.distance_km` before narrating "unusually warm" off this
            spread. The same holds for `normal_low_stddev`,
            `normal_mean_stddev`, `years` and `completeness_flag`.
          example: 5.4
        normal_low_stddev:
          type: number
          format: double
          description: |
            Standard deviation of the daily minimum. Station-sourced on the
            same terms as `normal_high_stddev`.
          example: 5.0
        normal_mean_stddev:
          type: number
          format: double
          description: |
            Standard deviation of the daily mean. Station-sourced on the same
            terms as `normal_high_stddev`.
          example: 4.7
        normal_precip:
          type: number
          format: double
          description: |
            Average daily precipitation amount — inches when `unit=imperial`,
            millimetres when `unit=metric`.

            The exact inverse of `normal_high_stddev`: that is always
            station-sourced, this is always grid-sourced. The station product
            publishes no daily precipitation normal at all, so this field comes
            only from the gridded CONUS product and is **omitted** on any day
            whose `source` is `station` — which includes every point outside
            CONUS. A series over Alaska or Hawaii carries temperatures with no
            precipitation until gridded normals exist there.

            `0` is a real value and is not the same as omitted: a daily normal
            is a 30-year mean spread across wet and dry days, so much of the
            arid West is a few hundredths of an inch. Do not treat a present
            zero as missing data.
          example: 0.11
        years:
          type: integer
          description: |
            Years of the base period contributing to this day, at the station.
            Station-sourced on the same terms as `normal_high_stddev`, so it
            does not describe the depth of a gridded value.
          example: 30
        completeness_flag:
          type: string
          description: |
            NCEI per-value completeness code, for the station. Station-sourced
            on the same terms as `normal_high_stddev`.
          example: C

    ClimateNormals:
      type: object
      description: |
        Day-of-year climate normals for a point, read from the gridded normals
        across CONUS and otherwise from the nearest station with records. The
        resolved station is always named, whichever supplied the values.
      required: [station, meta, days]
      properties:
        station:
          $ref: '#/components/schemas/ClimateNormalsStation'
        meta:
          $ref: '#/components/schemas/ClimateNormalsMeta'
        days:
          type: array
          description: Per-day normals series, in requested date order.
          items:
            $ref: '#/components/schemas/ClimateNormalsDay'

  responses:
    Problem400:
      description: Bad request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem401:
      description: Missing or invalid API key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: API key lacks required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: |
        Resource not found. For `/v1/weather`, returned when the requested
        location cannot be resolved (unknown ZIP, unrecognised free-text
        location) or when no upstream data covers the location.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem429:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem500:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem502:
      description: |
        Bad gateway. The service received an invalid response from an
        upstream data source. Transient; clients should retry with backoff.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem503:
      description: |
        Service unavailable. Typically returned when an upstream-reader
        circuit breaker has tripped after repeated failures. Transient;
        clients should retry with backoff and honor any `Retry-After`
        header.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem504:
      description: |
        Gateway timeout. An upstream data source did not respond within
        the service's budget.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
