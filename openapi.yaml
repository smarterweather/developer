  /v1/agriculture/growing-degree-days:
    get:
      operationId: getGrowingDegreeDays
      summary: Growing Degree Units (GDU / GDD) for a point.
      description: |
        Returns Growing Degree Units (also called Growing Degree Days) for a
        US point (CONUS, Alaska, Hawaii), computed on read from stored daily
        maximum/minimum temperatures. No GDU grids are stored; the values are
        derived per request from the temperature bundles, so a crop's
        base/upper thresholds and the simple/modified method can be selected
        freely without re-running the pipeline.

        **Two modes:**

        - **Forecast (default).** Without `season_start`, the response carries
          a per-day GDU series across the NBM forecast horizon (`days`).
        - **Season cumulative.** With `season_start` (a `YYYY-MM-DD` local
          date within the ~180-day observed window), the response stitches
          RTMA observed daily history + today's partial (hourly on-read
          rollup) + NBM forecast, returns a `cumulative_total`, and adds a
          per-day `cumulative_gdu` running sum. This is the number a grower
          tracks against crop growth-stage milestones. If part of the season
          window has no observed data, the per-day series still comes back
          `200` but `cumulative_total` is omitted and `meta.gaps` carries an
          `unfilled` span — a partial sum is not a season total.

        **Crops.** Pass a catalog `crop` id (e.g. `corn`, `soybean`,
        `wheat_winter`, `cotton`, `alfalfa`) to use calibrated thresholds, or
        `crop=custom` with `base_temp_c` (and optionally `upper_temp_c` /
        `method`) to supply your own.

        Every response echoes the resolved `method`, `thresholds` (always in
        °C), and a `meta` provenance block (`day_definition`,
        `computation_path`, `source`, `unit`, any `gaps`) so nothing is
        silently assumed.

        Launches behind the `AGRICULTURE_GDD_ENABLED` feature flag: returns
        `404` when the flag is off.
      tags: [Agriculture]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LatQuery'
        - $ref: '#/components/parameters/LonQuery'
        - name: crop
          in: query
          required: true
          description: |
            Crop catalog id (e.g. `corn`, `soybean`, `wheat_winter`,
            `cotton`, `alfalfa`) or `custom` to supply thresholds directly.
          schema:
            type: string
          example: corn
        - name: season_start
          in: query
          required: false
          description: |
            Season/planting start as a `YYYY-MM-DD` local date. Presence
            switches the response into cumulative season-to-date mode. Must be
            within the ~180-day observed-history window.
          schema:
            type: string
            format: date
          example: "2026-05-01"
        - name: days
          in: query
          required: false
          description: Forecast horizon in days (default 10).
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 10
        - name: day_definition
          in: query
          required: false
          description: |
            Daily boundary: `nws` (default; native NBM MaxT/MinT period
            extremes) or `local_calendar` (midnight-to-midnight local day).
          schema:
            type: string
            enum: [nws, local_calendar]
            default: nws
        - name: unit
          in: query
          required: false
          description: |
            Unit system for GDU + temperatures. `imperial` (default) uses
            °F-days; `metric` uses °C-days. Thresholds are always echoed in
            °C regardless.
          schema:
            type: string
            enum: [imperial, metric]
            default: imperial
        - name: base_temp_c
          in: query
          required: false
          description: Custom base threshold in °C. Required when `crop=custom`.
          schema:
            type: number
            format: double
        - name: upper_temp_c
          in: query
          required: false
          description: |
            Custom upper cutoff in °C (enables the modified method). Optional.
          schema:
            type: number
            format: double
        - name: method
          in: query
          required: false
          description: |
            GDU method for custom crops. Defaults based on whether
            `upper_temp_c` is supplied.
          schema:
            type: string
            enum: [simple, modified]
        - name: include_milestones
          in: query
          required: false
          description: Include the crop's growth-stage GDU milestones.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Growing Degree Units for the requested point.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingDegreeDays'
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '502':
          $ref: '#/components/responses/Problem502'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/climate/normals:
    get:
      operationId: getClimateNormals
      summary: Day-of-year climate normals for a point.
      description: |
        Returns the 1991-2020 NOAA/NCEI daily climate normals — the average
        high, low and mean temperature for each calendar day, plus the average
        daily precipitation across the contiguous US — for a US point.

        **Normals are climatology, not forecast.** They describe a 30-year base
        period, carry no valid time, and do not change day to day. Use them to
        answer "is tomorrow warmer than usual here?", not "how warm will it
        be?".

        **Where the values come from depends on the point,** and `meta.source`
        says which. Across the contiguous US they are read from NCEI's gridded
        normals at the requested coordinates (the nClimGrid 1/24° mesh, roughly
        5 km), so they describe that point directly: `source` is `grid`.
        Outside CONUS — Alaska, Hawaii, the territories — and for any day the
        grid has no value for, they come from the nearest station record, and
        `source` is `station`, or `mixed` where one series draws on both.

        **A station-sourced normal describes the station, not your point.** The
        response always names the station it resolved and how far away it is
        (`station.distance_km`), since the station lookup is what anchors the
        request either way. Past 50 km, a series carrying station-sourced
        values sets `meta.approximate`; past 150 km no station is considered
        representative and the endpoint returns `404`. A purely gridded series
        is never flagged however far that station happens to sit, because the
        grid value is the point's own normal. Where the flag does apply, NOAA's
        own use limitation is that representativeness degrades with distance,
        and elevation differences matter more than distance alone suggests.

        **Coverage.** The gridded normals cover the contiguous US; the station
        normals add roughly 7,400 US stations including Alaska, Hawaii and the
        territories. Remote points outside CONUS may have no station in range.

        **Precipitation is gridded-only.** `normal_precip` has no station
        equivalent — NCEI's station normals publish no daily precipitation
        normal — so it appears only on days whose `source` is `grid` and is
        omitted everywhere else, including for every point outside CONUS.
        Temperature normals are unaffected.

        Days inside the requested range with no normal available are still
        returned, with the temperature fields omitted and counted in
        `meta.missing_days`, so the series stays aligned with the dates you
        asked for.

        Launches behind the `CLIMATE_NORMALS_ENABLED` feature flag: returns
        `404` when the flag is off.
      tags: [Climate]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LatQuery'
        - $ref: '#/components/parameters/LonQuery'
        - name: start
          in: query
          required: false
          description: |
            First calendar day of the range, `YYYY-MM-DD`. Must be supplied
            together with `end`. Only the month and day are meaningful; the
            year selects which calendar the dates are echoed on.
          schema:
            type: string
            format: date
          example: "2026-07-28"
        - name: end
          in: query
          required: false
          description: |
            Last calendar day of the range (inclusive), `YYYY-MM-DD`. Must be
            supplied together with `start`.
          schema:
            type: string
            format: date
          example: "2026-08-10"
        - name: days
          in: query
          required: false
          description: |
            Range length in days starting today, used when `start` and `end`
            are omitted. Defaults to 14 to cover the forecast horizon.
          schema:
            type: integer
            minimum: 1
            maximum: 366
            default: 14
        - name: unit
          in: query
          required: false
          description: |
            Unit system for the values. `imperial` (default) uses °F and
            inches; `metric` uses °C and millimetres. Standard deviations are
            intervals and scale without the freezing-point offset.
          schema:
            type: string
            enum: [imperial, metric]
            default: imperial
      responses:
        '200':
          description: Climate normals for the requested point.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClimateNormals'
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '502':
          $ref: '#/components/responses/Problem502'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/point:
    get:
      operationId: getPointValue
      summary: Curated point value(s) for allowlisted stored data.
      description: |
        Returns the latest value of allowlisted stored data sampled at a point,
        with friendly output (canonical `unit`, an optional `category` label,
        `observed_at`, and a staleness flag).

        This is the one curated wrapper over the internal point-query: it serves
        only the `(product, var)` pairs on a server-side **allowlist**, so the
        public surface stays safe and small while every widget/card is
        onboarded by adding an allowlist entry — no new endpoint. Requesting a
        `(product, var)` that is not allowlisted returns `404` (single form) or
        a per-item `not_allowlisted` status (batch form).

        ### Data kinds (transparent to the caller)

        The allowlist entry's kind selects the internal resolution — a
        **scalar** raster/OM cell, or a vector **zone** (point-in-polygon
        outlook, e.g. SPC categorical / fire-weather). Both collapse to one
        answer at a location and share one envelope: `value`/`unit` are present
        for scalars and ordinal bands, `category`/`label` name the band, and a
        point in no band is a valid answer with `value: null` and
        `category: "none"` (not a 404).

        ### Single vs. batch

        - **Single** — `product` + `var` + `lat` + `lon` returns one
          `PointValue`.
        - **Batch** — `select` (multiple `(product, var)`) and/or `points`
          (multiple locations) returns a `PointBatchResponse` of per-point,
          per-value items, each with a `status`. One request can populate a
          whole family card (several metrics) or a map of locations; partial
          conditions (out of domain, not allowlisted, no data) are reported
          per item and never fail the whole request.

        ### Coverage

        Each allowlisted entry carries a coverage domain; a point outside it
        returns `404` (single) or an `out_of_domain` item (batch) without an
        upstream call. Scalar values are sampled from the nearest grid cell
        (products are snapped to a ~1 km grid), so nearby requests share cache
        entries.

        ### Staleness

        `approximate` is `true` when the value is older than the product's update
        cadence allows (e.g. a SPoRT-LIS daily analysis older than ~36 h, an
        MRMS hourly accumulation older than ~3 h).

        ### Caching

        Successful responses carry `Cache-Control` with a `max-age` keyed to the
        product's cadence (SPoRT-LIS daily: 30 min; MRMS QPE hourly: 5 min). The
        service additionally caches by `(product, var, rounded lat/lon)`.

        ### Auth

        Standard sw-api Bearer auth applies.
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: product
          in: query
          required: false
          description: |
            Allowlisted stored product identifier (lowercase, digits,
            underscores), e.g. `sport_rsm_0_2m_pct_conus`,
            `mrms_qpe_24h_pass2_conus`, or the outlook `spc_day1_categorical`.
            Single form: pair with `var` + `lat` + `lon`. Ignored when `select`
            is provided.
          schema:
            type: string
            pattern: '^[a-z0-9_]+$'
            minLength: 1
            maxLength: 128
          example: sport_rsm_0_2m_pct_conus
        - name: var
          in: query
          required: false
          description: |
            Variable identifier within the product, e.g. `rsm_0_2m_pct`,
            `qpe_24h`, or `risk` for zone outlooks. Ignored when `select` is
            provided.
          schema:
            type: string
            pattern: '^[a-z0-9_]+$'
            minLength: 1
            maxLength: 128
          example: rsm_0_2m_pct
        - name: lat
          in: query
          required: false
          description: Latitude of the point (single form). Ignored when `points` is provided.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 41.9
        - name: lon
          in: query
          required: false
          description: Longitude of the point (single form). Ignored when `points` is provided.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: -93.6
        - name: select
          in: query
          required: false
          description: |
            Batch form. One or more `product:var` selectors (each individually
            allowlisted). Repeat the parameter or comma-join within a single
            value, e.g.
            `select=sport_rsm_0_2m_pct_conus:rsm_0_2m_pct&select=spc_day1_categorical:risk`.
            Presence of `select` (or `points`) switches the response to
            `PointBatchResponse`. Max 25 selectors; points × selectors ≤ 500.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 25
            items:
              type: string
              pattern: '^[a-z0-9_]+:[a-z0-9_]+(,[a-z0-9_]+:[a-z0-9_]+)*$'
              minLength: 3
              maxLength: 1024
          example: [sport_rsm_0_2m_pct_conus:rsm_0_2m_pct, spc_day1_categorical:risk]
        - name: points
          in: query
          required: false
          description: |
            Batch form. One or more `lat,lon` locations. Repeat the parameter
            for multiple points (Go query parsing rejects `;`), e.g.
            `points=41.9,-93.6&points=42.0,-93.4`. Presence of `points` (or
            `select`) switches the response to `PointBatchResponse`. Max 100
            points; points × selectors ≤ 500.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              pattern: '^-?[0-9]+(\.[0-9]+)?,-?[0-9]+(\.[0-9]+)?$'
              minLength: 3
              maxLength: 64
          example: ["41.9,-93.6", "42.0,-93.4"]
      responses:
        '200':
          description: |
            The requested value(s). Single form (`product`+`var`+`lat`+`lon`)
            returns a `PointValue`; batch form (`select` and/or `points`)
            returns a `PointBatchResponse`.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PointValue'
                  - $ref: '#/components/schemas/PointBatchResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '502':
          $ref: '#/components/responses/Problem502'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/outlooks:
    get:
      operationId: getOutlookDetail
      summary: SPC outlook detail for a location, day, and hazard family.
      description: |
        Returns everything the Storm Prediction Center says about one
        outlook day at a point for a hazard family: the risk band, any
        probabilistic hazards (severe only), whether the location falls
        in a hatched significant-severe area, and the forecaster's full
        written discussion.

        This is the drill-down behind a risk area on a map. `GET
        /v1/weather?include=outlooks` already reports the single
        worst-case risk level at a location; this endpoint expands that
        into the per-hazard breakdown and the reasoning behind it.

        ### Hazard families

        `hazard=severe` (default) returns the convective outlook:
        categorical risk plus tornado/wind/hail probabilities, with the
        SWO discussion (`SWODY1`/`SWODY2`/`SWODY3`, or `SWOD48` for days
        4-8). `hazard=fire` returns the fire-weather outlook band
        (`ELEV`/`CRIT`/`EXTM`) and the FWD discussion (`FWDDY1`/
        `FWDDY2`, or `FWDD38` for days 3-8), plus a separate
        `dry_thunderstorm` band (`IDRT`/`SDRT`) when SPC has drawn one --
        the two fire criteria are independent, so either can be present
        without the other. Fire polygons exist for
        days 1-2 only, so a fire request for day 3+ may return a
        narrative with no band. `hazard=rain` returns the WPC Excessive
        Rainfall Outlook band (`MRGL`/`SLGT`/`MDT`/`HIGH`) for days 1-3
        and the QPFERD discussion (one PIL; day is selected from
        `properties.outlook_day`).

        ### Probabilities

        Days 1 and 2 are issued as separate `tornado`, `wind`, and `hail`
        products, so `probabilities` holds one entry per hazard. Day 3
        and beyond issue a single combined `probabilistic` product and
        yield one entry. Values are fractional (`0.15` = 15%). Fire and
        rain outlooks have no probabilistic products; `probabilities` is
        empty for those hazards.

        SPC delineates significant severe as its own polygon rather than
        an attribute of the probability area. Where the two overlap they
        are reported as a single entry carrying both the probability and
        `significant: true`, so a 15% hail area with a hatched overlay
        reads as one hazard rather than two.

        ### Narrative

        `narrative` carries the discussion for the requested family and
        day. It is ingested separately from the outlook polygons, so it
        may be absent for a few minutes after a new issuance, and it is
        omitted rather than erroring when unavailable.

        ### Empty results

        A location outside every outlook polygon is a valid answer: `200`
        with an empty `probabilities` array and no `categorical`. Only an
        upstream failure produces an error.

        ### Caching

        Successful responses are cacheable for 5 minutes. SPC reissues
        the day 1 outlook a handful of times a day.

        ### Auth

        Standard sw-api Bearer auth applies.
      tags: [Weather]
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude in decimal degrees.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 35.48
        - name: lon
          in: query
          required: true
          description: Longitude in decimal degrees.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: -97.53
        - name: day
          in: query
          required: false
          description: |
            Outlook day to describe, where 1 is today. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 1
          example: 1
        - name: hazard
          in: query
          required: false
          description: |
            Hazard family. `severe` (default) is the SPC convective
            outlook; `fire` is the SPC fire-weather outlook; `rain` is
            the WPC Excessive Rainfall Outlook. Matches the vocabulary
            used by sw-mcp's `get_outlooks`.
          schema:
            type: string
            enum: [severe, fire, rain]
            default: severe
          example: severe
      responses:
        '200':
          description: Outlook detail for the requested day and location.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutlookDetail'
        '400':
          $ref: '#/components/responses/Problem400'
        '502':
          $ref: '#/components/responses/Problem502'
        '504':
          $ref: '#/components/responses/Problem504'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      # `bearerFormat` is informational per OpenAPI 3.1; SDK generators use
      # it as a hint when naming the credential field.
      bearerFormat: sw_live_*|sw_test_*
      description: |
        API key passed as an HTTP Bearer token (RFC 6750):

        ```
        Authorization: Bearer sw_live_xxxx...
        ```

        Keys are issued in two flavors:

        - `sw_live_*` -- production keys; requests are billed and counted
          against rate limits.
        - `sw_test_*` -- test-mode keys; requests return live data but are
          excluded from billing meter events. Useful for CI and local
          development.

        Get a key from the developer dashboard at
        [smarterweather.com/developers/dashboard](https://smarterweather.com/developers/dashboard)
        once general availability ships.

  parameters:
    LatQuery:
      name: lat
      in: query
      description: |
        Latitude. Must be provided together with `lon`. Mutually exclusive
        with `zip` and `location`.
      required: false
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      example: 42.3601
    LonQuery:
      name: lon
      in: query
      description: |
        Longitude. Must be provided together with `lat`. Mutually exclusive
        with `zip` and `location`.
      required: false
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      example: -71.0589
    ZipQuery:
      name: zip
      in: query
      description: |
        5-digit US ZIP code. Mutually exclusive with `lat`/`lon` and
        `location`.
      required: false
      schema:
        type: string
        pattern: '^\d{5}$'
      example: "02108"
    LocationQuery:
      name: location
      in: query
      description: |
        Free-text location name. Examples: `"Boston, MA"`, `"94043"`,
        `"Kyiv"`. Resolved by an internal geocoder. Mutually exclusive with
        `lat`/`lon` and `zip`.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: "Boston, MA"
    UnitsQuery:
      name: units
      in: query
      description: |
        Unit system for numeric response fields. `imperial` (default) uses
        °F, mph, inHg, mi, in; `metric` uses °C, kph, hPa, km, mm. See the
        `Units` schema returned with every response for the exact label set.
      required: false
      schema:
        type: string
        enum: [imperial, metric]
        default: imperial
    IncludeQuery:
      name: include
      in: query
      description: |
        Comma-separated list of sections to include. See the "Include
        tokens" table in `info.description` for the full catalog, defaults,
        and stability markers. Unknown tokens are silently dropped.
      required: false
      schema:
        type: string
      example: "current,hourly,daily,alerts"
    DaysQuery:
      name: days
      in: query
      description: Number of days for the daily forecast.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 14
        default: 10
    HourlyHoursQuery:
      name: hourly_hours
      in: query
      description: Number of hours for the hourly forecast.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 168
        default: 48

  headers:
    RateLimitLimit:
      description: The request-rate limit for this API key in the current window.
      schema:
        type: integer
        minimum: 0
    RateLimitRemaining:
      description: The number of requests remaining in the current window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Unix epoch seconds at which the current window resets.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Seconds to wait before retrying after a rate-limit rejection.
      schema:
        type: integer
        minimum: 0

  examples:
    WeatherBoston:
      summary: Composite weather response for Boston, MA (default include, imperial).
      value:
        location:
          lat: 42.3601
          lon: -71.0589
          name: "Boston"
          region: "MA"
          country: "US"
          timezone: "America/New_York"
          county: "Suffolk"
          zip: "02108"
        current:
          time: "2026-04-20T15:00:00Z"
          temperature: 58.4
          feels_like: 56.1
          humidity: 62
          dew_point: 45.2
          pressure: 30.05
          wind_speed: 11.3
          wind_gust: 17.8
          wind_direction: 240
          visibility: 10
          cloud_cover: 35
          uv_index: 5
          precip_rate: 0
          precip_type: "none"
          conditions: "Partly Cloudy"
          icon: "partly-cloudy-day"
          severe: false
        hourly:
          - time: "2026-04-20T16:00:00Z"
            temperature: 59.1
            feels_like: 56.8
            humidity: 60
            wind_speed: 12.1
            wind_direction: 245
            precip_probability: 5
            precip_amount: 0
            conditions: "Partly Cloudy"
            icon: "partly-cloudy-day"
          - time: "2026-04-20T17:00:00Z"
            temperature: 59.6
            feels_like: 57.2
            humidity: 58
            wind_speed: 12.4
            wind_direction: 245
            precip_probability: 5
            precip_amount: 0
            conditions: "Partly Cloudy"
            icon: "partly-cloudy-day"
        daily:
          - date: "2026-04-20"
            high: 61.0
            low: 44.5
            humidity_avg: 55
            wind_speed_max: 14.2
            wind_direction: 240
            precip_probability: 10
            precip_total: 0
            snow_total: 0
            conditions: "Partly Cloudy"
            icon: "partly-cloudy-day"
            day:
              temperature: 61.0
              wind_speed: 14.2
              wind_direction: 240
              precip_probability: 10
              precip_total: 0
              conditions: "Partly Cloudy"
              icon: "partly-cloudy-day"
              narrative: "Partly cloudy with a high near 61. West winds 10 to 15 mph."
            night:
              temperature: 44.5
              wind_speed: 6.8
              wind_direction: 260
              precip_probability: 5
              precip_total: 0
              conditions: "Mostly Clear"
              icon: "mostly-clear-night"
              narrative: "Mostly clear with a low around 45. Winds becoming light."
        alerts: []
        outlooks: []
        astro:
          civil_dawn: "2026-04-20T09:37:00Z"
          sunrise: "2026-04-20T10:05:00Z"
          solar_noon: "2026-04-20T16:47:00Z"
          sunset: "2026-04-20T23:29:00Z"
