openapi: 3.1.0
info:
  title: Smarter Weather API
  summary: Public REST API for the Smarter Weather developer platform
  description: |
    The public REST API for Smarter Weather (`sw-api`).

    ## Versioning and deprecation

    - Path-based versioning (`/v1/`).
    - Endpoint removal: 6 months notice.
    - Breaking shape changes: 90 days notice.
    - Active deprecations are listed at `GET /.well-known/deprecations`.
    - Non-breaking additions ship without notice.
    - Fields marked `x-stability: experimental` (also flagged in their
      descriptions) are excluded from the 90-day breaking-change
      commitment during Phase 2 closed beta. Stability commitments apply
      to every field at general availability per ADR 001 unless
      explicitly carved out.

    ## Errors

    Error responses (`4xx`, `5xx`) are served with content type
    `application/problem+json` per [RFC 7807](https://datatracker.ietf.org/doc/html/rfc7807).
    Successful responses use `application/json`.

    ## Authentication

    Most endpoints require an API key passed as an HTTP Bearer token in the
    `Authorization` header:

    ```
    Authorization: Bearer sw_live_xxxx...
    ```

    Test-mode keys (`sw_test_*`) return live data but are excluded from
    billing meter events. Get a key from the developer dashboard at
    [https://smarterweather.com/developers/dashboard](https://smarterweather.com/developers/dashboard)
    once general availability ships.

    ## Rate limits

    Authenticated operations return rate-limit state on every response via
    `RateLimit-Limit`, `RateLimit-Remaining`, and `RateLimit-Reset`
    headers. Exceeding the rate limit returns `429 Too Many Requests` with a
    `Retry-After` header. See individual operation responses for header
    definitions.

    ## `/v1/weather` include tokens

    `/v1/weather` returns a composite response. The `include` query parameter
    is a comma-separated list of sections to include. Unknown tokens are
    silently ignored. The token set is:

    | Token       | Default | Stability | Description                                       |
    |-------------|:-------:|-----------|---------------------------------------------------|
    | `current`   | yes     | stable    | Current conditions (RTMA + MRMS).                 |
    | `hourly`    | yes     | stable    | Hourly forecast (1-168 hours, default 48).        |
    | `daily`     | yes     | stable    | Daily forecast (1-14 days, default 10).           |
    | `alerts`    | yes     | stable    | Active NWS alerts for the location.               |
    | `outlooks`  | yes     | stable    | SPC convective outlooks for the location.         |
    | `astro`     | yes     | stable    | Sunrise/sunset/moon phase, etc.                   |
    | `location`  | no      | stable    | Echo of the resolved location (lat/lon/name/tz).  |
    | `gis`       | no      | stable    | Geographic metadata (population, timezone, nearest radar site). |
    | `narrations`| no      | experimental | LLM-generated narrative text for current/short-term conditions. |
    | `guidance`  | no      | experimental | Distilled NWS forecaster text-product data (AFD/HWO/SWO/MCD).   |
    | `uncertainty` | no    | experimental | NBM probabilistic sub-objects on hourly and daily forecasts (CONUS/Alaska/Hawaii only). |
    | `nowcast`     | no    | experimental | MRMS radar precipitation nowcast (60 min @ 5-min steps, CONUS first). |
    | `climate`     | no    | experimental | NCEI day-of-year normals for the location, plus per-day departure from normal on `daily[]`. |

    `radar` and `products` (wx visual-products manifest) are **not** in the
    v1 token set. They will land in Phase 5 alongside a separate
    `/v1/radar/*` family, once the public CDN authentication design
    (signed-URL minting or equivalent) is accepted in a follow-up ADR.
  version: 0.1.0
  contact:
    name: Smarter Weather Developer Platform
    url: https://github.com/smarterweather/developer

# Canonical public base URL. Adopted by sw-api at the Phase 2 closed-beta
# launch via Track A.3 PR-0 (#7754) per ADR 013, which supersedes ADR 006's
# "interim execute-api hostname through Phase 5" plan.
#
# SDK generators emit https://api.smarterweather.com as the default base URL
# from this point on. Closed-beta design partners onboarded against the raw
# *.execute-api.us-east-1.amazonaws.com URL (per superseded ADR 006) keep
# working -- the API Gateway URL is unaffected by the CloudFront repointing
# in PR-0 -- but should switch to the canonical hostname before GA.
servers:
  - url: https://api.smarterweather.com
    description: Production

tags:
  - name: Weather
    description: Public weather data endpoints.
  - name: Observations
    description: |
      Surface observations and upper-air soundings sampled at or nearest to a
      point.
  - name: Alerts
    description: NWS weather alert lookups.
  - name: Storms
    description: Severe-weather tracking products (storm tracks, etc.).
  - name: Products
    description: |
      Gridded / vector weather products and derived summaries (risk-zone
      population exposure, etc.).
  - name: Geocode
    description: |
      Forward, reverse, and typeahead geocoding for locations within
      the supported NWS coverage domain (CONUS, AK, HI, PR, GU/MP).
  - name: Health
    description: Service health.
  - name: Meta
    description: Cross-cutting platform endpoints (deprecations, etc.).
  - name: Agriculture
    description: |
      Agriculture-derived indices (Growing Degree Units / GDD) computed on
      read from stored daily temperature extremes.
  - name: Climate
    description: |
      Climatology: long-period day-of-year statistics describing what is
      typical at a location, as distinct from what is forecast.

security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Service health probe.
      description: |
        Returns service readiness and downstream connectivity. Does not require
        authentication.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /v1/status:
    get:
      operationId: getStatus
      summary: Platform data-freshness status.
      description: |
        Returns the current data-freshness status of the weather platform:
        an overall state, per-source states, open incidents, and any active
        provider advisories.

        Every source is continuously evaluated against its expected
        publication cadence across the ingestion, processing, and serving
        stages. States:

        - `ok` — data is flowing within its expected cadence.
        - `degraded` — data is staler than expected but below outage
          thresholds.
        - `outage` — data has been stale long enough to be considered an
          outage. The `incident.cause` field attributes it (e.g.
          `provider_outage` vs `processing_delay`).
        - `no_signal` — the monitor has no signal for this source
          (instrumentation gap, not necessarily a data gap).

        The document regenerates about every 5 minutes; responses carry
        `Cache-Control: public, max-age=60`. This endpoint does **not**
        require authentication, so it stays reachable during the incidents
        it describes — agents and integrations should consult it before
        reporting weather data as current, and may relay `advisories`
        entries to end users.
      tags: [Meta]
      security: []
      responses:
        '200':
          description: Current platform status document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStatus'
        '502':
          description: The status document could not be retrieved.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Platform status is not configured in this environment.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/weather:
    get:
      operationId: getWeather
      summary: Get blended weather for a location.
      description: |
        Returns a composite blended weather payload for a single location.
        A single call covers current conditions, hourly forecast, daily
        forecast, active alerts, convective outlooks, and astronomical data
        by default; other sections (location echo, geographic metadata,
        narrative text, forecaster guidance) are available via the
        `include` parameter.

        ### Location selector

        Exactly **one** of the following must be provided:

        - `lat` **and** `lon` — latitude/longitude pair.
        - `zip` — 5-digit US ZIP code.
        - `location` — free-text location name (e.g., `"Boston, MA"`,
          `"94043"`, `"Kyiv"`). Resolved by the same upstream geocoder
          that powers the dedicated `/v1/geocode/{search,autosuggest,reverse}`
          endpoints; clients that need geocoding without a weather
          fetch should call those directly.

        Sending more than one selector, or none, returns `400`.

        ### Units

        - `imperial` (default): °F, mph, inHg, mi, in.
        - `metric`: °C, kph, hPa, km, mm.

        SI is not exposed in v1; partners that need SI should convert
        client-side.

        ### Include semantics

        `include` is a comma-separated list. Unknown tokens are silently
        dropped. See the API-level "Include tokens" table in the
        `info.description` for the full token catalog, defaults, and
        stability markers.

        ### Coverage

        Sections that depend on US-only datasets (e.g., `alerts`, some
        `outlooks`, radar-adjacent `gis.nearest_radar` fields) may be
        empty or absent for international locations. Partial-coverage
        scenarios are reported via `meta.warnings[]` with a structured
        code so clients can respond programmatically.
      tags: [Weather]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LatQuery'
        - $ref: '#/components/parameters/LonQuery'
        - $ref: '#/components/parameters/ZipQuery'
        - $ref: '#/components/parameters/LocationQuery'
        - $ref: '#/components/parameters/UnitsQuery'
        - $ref: '#/components/parameters/IncludeQuery'
        - $ref: '#/components/parameters/DaysQuery'
        - $ref: '#/components/parameters/HourlyHoursQuery'
      responses:
        '200':
          description: Blended weather data for the requested location.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Weather'
              examples:
                boston:
                  $ref: '#/components/examples/WeatherBoston'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '502':
          $ref: '#/components/responses/Problem502'
        '503':
          $ref: '#/components/responses/Problem503'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/weather/batch:
    post:
      operationId: postWeatherBatch
      summary: Get blended weather for up to 25 locations in one call.
      description: |
        Multi-location form of `GET /v1/weather`. Accepts a JSON body with
        an array of up to 25 locations and returns one F2 weather result
        per input, preserving order.

        ### Locations

        Each entry in `locations[]` follows the same selector rules as
        the single-location endpoint: exactly one of `lat`+`lon`, `zip`,
        or `location` must be set. Mixing selectors in a single entry,
        or omitting all of them, fails that row only — the rest of the
        batch still runs.

        ### Per-location failure semantics

        A single location failure does not fail the whole request. The
        corresponding `results[i]` carries `error` (a structured
        `WeatherBatchError`) instead of `weather`. Callers can detect a
        partial result by scanning for non-null `error` fields on
        `results[]`. Section-level partial failures inside a successfully
        resolved location surface as `weather.meta.warnings[]`, exactly
        as for `GET /v1/weather`.

        ### Shared parameters

        `include`, `units`, `days`, and `hourly_hours` are applied to
        every location; per-location overrides are not supported. Defaults
        match the `GET /v1/weather` defaults.
      tags: [Weather]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherBatchRequest'
            examples:
              twoLocations:
                $ref: '#/components/examples/WeatherBatchRequestTwoLocations'
      responses:
        '200':
          description: Batch result, one entry per input location.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherBatchResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '502':
          $ref: '#/components/responses/Problem502'
        '503':
          $ref: '#/components/responses/Problem503'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/alerts/{id}:
    get:
      operationId: getAlertById
      summary: Get a single NWS alert by id.
      description: |
        Returns the full alert detail (geometry, spatial metadata,
        affected population, etc.) for a single NWS alert. Accepts
        either a `group_id` (the canonical primary key on the alerts
        table) or a `message_id` (resolved via `nws_alerts_map`);
        callers do not need to disambiguate.

        ### Caching

        Successful responses carry `Cache-Control: public, max-age=60`
        to match the upstream cache policy. CDN edge cache is keyed
        on the URL path so cache invalidation tracks alert
        replacement / cancellation events naturally.

        ### Geometry

        `geometry` is a GeoJSON object embedded in the response.
        Clients should treat it as opaque GeoJSON: forward-compat
        fields the upstream pipeline adds without a sw-api release
        pass through unchanged.

        ### Auth

        Standard sw-api Bearer auth applies. Internal first-party
        keys (`sw_internal_web_*`, `sw_internal_ios_*`,
        `sw_internal_og_*`) are accepted alongside `sw_live_*` /
        `sw_test_*` partner keys; the OG-image lambda authenticates
        with the `og` audience.
      tags: [Alerts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: |
            Alert identifier — either `group_id` (canonical primary
            key) or `message_id` (NWS-issued, resolved via
            `nws_alerts_map`). URL-encode embedded dots / colons /
            slashes; the handler `url.PathEscape`s on the wire.
          schema:
            type: string
            minLength: 1
            maxLength: 256
          example: "1.2.3-NWS-WW.SAMPLE.CASE"
      responses:
        '200':
          description: Alert detail for the requested id.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '502':
          $ref: '#/components/responses/Problem502'
        '503':
          $ref: '#/components/responses/Problem503'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/products/{product_id}/exposure-summary:
    get:
      operationId: getProductExposureSummary
      summary: Cumulative population exposure for a risk-zone product.
      description: |
        Returns the total population inside all risk-band polygons at or above
        a threshold level for a risk-zone product's latest issuance — the data
        behind headlines like "~57M under major heat risk".

        Generic across every product that publishes exclusive risk-band
        polygons (NWS HeatRisk today; SPC categorical, WPC flood, and
        winter/cold outlooks later). Because the bands are spatially exclusive,
        a cumulative `>= min_level` figure is a straight sum with no
        double-counting.

        ### Parameters

        `min_level` is the inclusive cumulative threshold on the ordinal
        `risk_level` (e.g. HeatRisk `3` = Major and above). When omitted the
        upstream default (`1`, any elevated risk) applies. `valid_time` selects
        a specific issuance (RFC3339); omit it for the latest.

        ### Caching

        Successful responses carry `Cache-Control: public, max-age=60,
        stale-while-revalidate=60`. Edge cache key includes the query string
        so each `min_level` / `valid_time` variant gets its own TTL.

        ### Auth

        Standard sw-api Bearer auth applies.
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          description: |
            Risk-zone product identifier (lowercase, digits, underscores),
            e.g. `heatrisk_day1_conus`.
          schema:
            type: string
            pattern: '^[a-z0-9_]+$'
            minLength: 1
            maxLength: 128
          example: "heatrisk_day1_conus"
        - name: min_level
          in: query
          required: false
          description: Inclusive cumulative threshold on the ordinal risk_level.
          schema:
            type: integer
            minimum: 0
          example: 3
        - name: valid_time
          in: query
          required: false
          description: RFC3339 issuance (valid_time) to summarize. Defaults to the latest.
          schema:
            type: string
            format: date-time
          example: "2026-06-30T22:00:00Z"
      responses:
        '200':
          description: Cumulative population-exposure summary.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required: [product_id, min_level, population, feature_count]
                properties:
                  product_id:
                    type: string
                    example: "heatrisk_day1_conus"
                  min_level:
                    type: integer
                    example: 3
                  population:
                    type: integer
                    format: int64
                    description: Total population under risk_level >= min_level.
                    example: 57000000
                  feature_count:
                    type: integer
                    description: Number of risk-band polygons contributing to the sum.
                    example: 2
                  valid_time:
                    type: ["string", "null"]
                    format: date-time
                    description: Issuance the summary was computed for (null if no features).
                    example: "2026-06-30T22:00:00Z"
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '502':
          $ref: '#/components/responses/Problem502'
        '503':
          $ref: '#/components/responses/Problem503'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/storm-tracks:
    get:
      operationId: getStormTracks
      summary: Get active storm-cell tracks as GeoJSON.
      description: |
        Returns a GeoJSON `FeatureCollection` of active storm-cell
        tracks aggregated from NEXRAD radar products. Each feature
        carries cell metadata (id, site, scan / valid times) plus an
        optional impact section listing affected cities and population
        when `detailed=true` is requested.

        ### Site filter

        `site` is an optional NEXRAD radar site code. The storm-track
        pipeline keys on the 3-letter site code (e.g., `LOT`, `TLX`);
        a 4-letter ICAO (e.g., `KLOT`) is also accepted. Empty `site`
        returns one feature per active radar cell across the network;
        setting `site` filters to that radar. Site IDs are uppercased
        server-side.

        ### Detailed mode

        `detailed=true` requests the LATERAL-joined impact payload
        (`properties.impact.affected_cities`,
        `properties.impact.affected_population`). Detailed responses
        are larger and use a 60s reader cache; the all-sites all-cells
        path uses a 30s cache.

        ### Schema stability

        The GeoJSON `type`, `geometry`, and `properties.cell_id` /
        `properties.site_id` / `properties.scan_time` /
        `properties.valid_time` fields are stable. Other property-bag
        keys (`impact.*`, `category`, etc.) are documented as
        forward-compat: the reader pipeline may add new keys without a
        sw-api release, so consumers should treat unknown keys as
        opaque additive data.

        ### Caching

        Successful responses carry `Cache-Control: public, max-age=30,
        stale-while-revalidate=30`. Edge cache key includes the
        full query string (`site` and `detailed`) so each variant
        gets its own TTL.

        ### Auth

        Standard sw-api Bearer auth applies. The legacy CRA storm-tracks
        UI uses `sw_internal_web_*` keys; partners use `sw_live_*`.
      tags: [Storms]
      security:
        - bearerAuth: []
      parameters:
        - name: site
          in: query
          required: false
          description: |
            Optional NEXRAD radar site code. The storm-track pipeline keys
            on the 3-letter site code (e.g., `LOT`); a 4-letter ICAO (e.g.,
            `KLOT`) is also accepted. Empty returns active cells across all
            radar sites.
          schema:
            type: string
            pattern: '^[A-Za-z][A-Za-z0-9]{2,3}$'
            minLength: 3
            maxLength: 4
          example: "LOT"
        - name: detailed
          in: query
          required: false
          description: |
            When `true`, includes the LATERAL-joined impact payload
            (affected cities + populations). When omitted or `false`,
            returns the lightweight cell-only response.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: |
            GeoJSON FeatureCollection. Empty `features` array when no
            active cells are tracked (this is a 200, not a 404 — a 200
            with `{"features": []}` is the canonical "no active storms"
            response).
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/StormTracksFeatureCollection'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '502':
          $ref: '#/components/responses/Problem502'
        '503':
          $ref: '#/components/responses/Problem503'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/observations:
    get:
      operationId: getObservations
      summary: Get latest METAR station observations as GeoJSON.
      description: |
        Returns a GeoJSON FeatureCollection of METAR surface observations
        ingested from MADIS. By default returns the latest observation per
        station within the last 2 hours. Optional `station`, `hours`, and
        bounding-box (`min_lon`, `min_lat`, `max_lon`, `max_lat`) filters
        are forwarded to the reader.
      tags: [Observations]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LatQuery'
        - $ref: '#/components/parameters/LonQuery'
        - name: station
          in: query
          schema:
            type: string
        - name: hours
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 24
        - name: min_lon
          in: query
          schema:
            type: number
        - name: min_lat
          in: query
          schema:
            type: number
        - name: max_lon
          in: query
          schema:
            type: number
        - name: max_lat
          in: query
          schema:
            type: number
      responses:
        '200':
          description: GeoJSON FeatureCollection of METAR observations.
          content:
            application/geo+json:
              schema:
                type: object
        '502':
          $ref: '#/components/responses/Problem502'

  /v1/observations/nearest:
    get:
      operationId: getObservationsNearest
      summary: Get nearest METAR station observations.
      description: |
        Returns the N nearest METAR stations to a point, deduplicated to
        the latest observation per station, sorted by distance.
      tags: [Observations]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LatQuery'
        - $ref: '#/components/parameters/LonQuery'
        - name: n
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 1
      responses:
        '200':
          description: GeoJSON FeatureCollection of nearest METAR observations.
          content:
            application/geo+json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem400'
        '502':
          $ref: '#/components/responses/Problem502'

  /v1/soundings:
    get:
      operationId: getSoundings
      summary: Get latest RAOB radiosonde soundings as GeoJSON.
      description: |
        Returns a GeoJSON FeatureCollection of RAOB (radiosonde) vertical
        soundings ingested from MADIS. By default returns the latest sounding
        per station within the last 24 hours. Optional `station` and `hours`
        filters are forwarded to the reader.

        Heavy `profile` and `wind_profile` arrays are stripped from bulk
        responses to keep payloads small for map overlays. Use
        `/v1/soundings/nearest` to fetch the full vertical profile for a
        specific site.

        Each feature retains `station_id`, `observed_at`, `elevation_m`,
        `level_count`, `wind_level_count`, and the `derived` indices object
        (see `/v1/soundings/nearest` for field descriptions). The reader
        also injects `valid_time` from the database column.
      tags: [Observations]
      security:
        - bearerAuth: []
      parameters:
        - name: station
          in: query
          schema:
            type: string
        - name: hours
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 24
      responses:
        '200':
          description: GeoJSON FeatureCollection of RAOB soundings (profile stripped).
          content:
            application/geo+json:
              schema:
                type: object
        '502':
          $ref: '#/components/responses/Problem502'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/soundings/nearest:
    get:
      operationId: getSoundingsNearest
      summary: Get nearest RAOB radiosonde soundings.
      description: |
        Returns the N nearest RAOB (radiosonde) vertical soundings to a
        point, deduplicated to the latest sounding per station, sorted by
        distance. Soundings are launched at 00Z/12Z, so data can be several
        hours old.

        Each feature carries:

        - `profile` — the pressure-indexed thermodynamic sounding (mandatory
          + significant-temperature levels merged, sorted surface-first) with
          aligned arrays `pressure_hpa`, `height_m` (null at
          significant-temperature-only levels), `temperature_c`, `dewpoint_c`,
          `wind_dir`, `wind_speed_kt`, plus `level_count`.
        - `wind_profile` — a height-indexed wind sounding (mandatory +
          significant-wind levels, sorted ascending by height MSL) with aligned
          arrays `height_m`, `wind_dir`, `wind_speed_kt`, plus
          `wind_level_count`. Use this for hodographs and shear.
        - `derived` — server-computed thermodynamic/kinematic indices
          (metric-raw, every field nullable): `sbcape`/`sbcin`,
          `mucape`/`mucin`, `mlcape`/`mlcin` (J/kg); `lifted_index`,
          `k_index`, `total_totals` (°C); `pwat_mm`; `freezing_level_m`;
          `lcl_*`/`lfc_*`/`el_*` pressure and height; `bulk_shear_0_6km_kt`.
        - station metadata: `station_id`, `observed_at`, `elevation_m`.

        The full `properties` bag is forward-compatible: the reader pipeline
        may add keys without a sw-api release, so treat unknown keys as opaque.
      tags: [Observations]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LatQuery'
        - $ref: '#/components/parameters/LonQuery'
        - name: n
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
            default: 1
      responses:
        '200':
          description: GeoJSON FeatureCollection of nearest RAOB soundings.
          content:
            application/geo+json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Problem400'
        '502':
          $ref: '#/components/responses/Problem502'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/storm-reports:
    get:
      operationId: getStormReports
      summary: Get recent NWS local storm reports as GeoJSON.
      description: |
        Returns a GeoJSON `FeatureCollection` of recent NWS local storm
        reports (LSR) — observed tornadoes, hail, damaging wind, flood,
        etc. Each feature carries the report's geometry plus a
        `properties` bag with at minimum `valid_time` and the
        report's payload fields (event-type-specific magnitude /
        narrative). The full property bag is forward-compat: the reader
        pipeline may add new keys without a sw-api release, so consumers
        should treat unknown keys as opaque additive data.

        ### Filters

        - `hours` — rolling lookback in whole hours (1 ≤ N ≤ 168). Empty
          falls through to the reader's default window.
        - `type` — single-letter NWS report code (e.g. `T` tornado, `H`
          hail, `W` damaging wind, `F` flood). Server uppercases the
          input before forwarding.
        - `wfo` — 3-letter NWS Weather Forecast Office identifier (e.g.
          `LOT`). Server uppercases the input.

        Filters compose: setting all three returns the AND of each
        filter applied to the reader's recent-reports table.

        ### Caching

        Successful responses carry `Cache-Control: public, max-age=30,
        stale-while-revalidate=30`. Edge cache key includes the full
        query string so each filter combination gets its own TTL.

        ### Auth

        Standard sw-api Bearer auth applies.
      tags: [Storms]
      security:
        - bearerAuth: []
      parameters:
        - name: hours
          in: query
          required: false
          description: |
            Rolling lookback window in whole hours (1-168). When empty,
            the reader's default window applies.
          schema:
            type: integer
            minimum: 1
            maximum: 168
          example: 6
        - name: type
          in: query
          required: false
          description: |
            Single-letter NWS report code. Common values include
            `T` (tornado), `H` (hail), `W` (damaging wind), `F` (flood).
          schema:
            type: string
            pattern: '^[A-Za-z]$'
            minLength: 1
            maxLength: 1
          example: "T"
        - name: wfo
          in: query
          required: false
          description: |
            3-letter NWS Weather Forecast Office identifier
            (e.g. `LOT` for Chicago).
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
            minLength: 3
            maxLength: 3
          example: "LOT"
      responses:
        '200':
          description: |
            GeoJSON FeatureCollection. Empty `features` array when no
            reports match the filters (200, not 404).
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/StormReportsFeatureCollection'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '502':
          $ref: '#/components/responses/Problem502'
        '503':
          $ref: '#/components/responses/Problem503'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/nexrad/features:
    get:
      operationId: getNexradFeatures
      summary: Get NEXRAD Level III algorithm-detection overlays as GeoJSON.
      description: |
        Returns a GeoJSON `FeatureCollection` of NEXRAD Level III
        algorithm-detection overlays — Hail Index, Mesocyclone, and
        Tornado Vortex Signature (TVS) — for a single radar site. Each
        feature carries `site_id` plus the product-specific detection
        payload (e.g. probability-of-hail / max hail size, mesocyclone
        or TVS strength) in a forward-compat `properties` bag. Treat
        unknown keys as opaque additive data.

        ### Product selector

        `product` is required and selects which detection layer to
        return: `hail_index`, `mesocyclone`, or `tvs`.

        ### Site selector

        `site` is the 3-letter Level III radar site code (e.g. `TLX`);
        a 4-letter ICAO (e.g. `KTLX`) is also accepted and uppercased
        server-side. As an alternative to `site`, pass `lat` + `lon`
        together to resolve the nearest radar server-side.

        ### Caching

        Successful responses carry `Cache-Control: public, max-age=30,
        stale-while-revalidate=30`.

        ### Auth

        Standard sw-api Bearer auth applies.
      tags: [Storms]
      security:
        - bearerAuth: []
      parameters:
        - name: product
          in: query
          required: true
          description: |
            Detection product to return. One of `hail_index`,
            `mesocyclone`, `tvs`.
          schema:
            type: string
            enum: [hail_index, mesocyclone, tvs]
          example: "hail_index"
        - name: site
          in: query
          required: false
          description: |
            NEXRAD Level III radar site code. 3-letter (e.g. `TLX`) or
            4-letter ICAO (e.g. `KTLX`); uppercased server-side. Omit to
            use the `lat`/`lon` nearest-radar fallback.
          schema:
            type: string
            pattern: '^[A-Za-z][A-Za-z0-9]{2,3}$'
            minLength: 3
            maxLength: 4
          example: "TLX"
        - name: lat
          in: query
          required: false
          description: |
            Latitude for nearest-radar resolution. Must be provided
            together with `lon`; ignored when `site` is set.
          schema:
            type: number
            format: double
          example: 35.33
        - name: lon
          in: query
          required: false
          description: |
            Longitude for nearest-radar resolution. Must be provided
            together with `lat`; ignored when `site` is set.
          schema:
            type: number
            format: double
          example: -97.28
      responses:
        '200':
          description: |
            GeoJSON FeatureCollection. Empty `features` array when no
            detections exist for the product/site (200, not 404).
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/NexradFeaturesFeatureCollection'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '502':
          $ref: '#/components/responses/Problem502'
        '503':
          $ref: '#/components/responses/Problem503'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/tropical:
    get:
      operationId: getTropical
      summary: Get the aggregated NHC tropical overlay as GeoJSON.
      description: |
        Returns a single GeoJSON `FeatureCollection` aggregating the
        latest National Hurricane Center tropical overlay: forecast cone,
        track line, forecast points, and coastal watch/warning segments
        for every active storm, plus the 7-day Tropical Weather Outlook
        (TWO) areas. Each feature carries a `kind` property the client
        uses to pick its renderer (`cone`, `track`, `points`,
        `watch_warning`, `two`); the `properties` bag is forward-compat.

        The endpoint takes no parameters.

        ### Caching

        Successful responses carry `Cache-Control: public, max-age=60,
        stale-while-revalidate=60`.

        ### Auth

        Standard sw-api Bearer auth applies.
      tags: [Storms]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: |
            GeoJSON FeatureCollection. Empty `features` array when no
            tropical systems or outlook areas are active (200, not 404).
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/TropicalFeatureCollection'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '502':
          $ref: '#/components/responses/Problem502'
        '503':
          $ref: '#/components/responses/Problem503'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/record-events:
    get:
      operationId: getRecordEvents
      summary: Get NWS climate-record events as GeoJSON.
      description: |
        Returns a GeoJSON `FeatureCollection` of NWS climate-record
        events (record high / low temperatures, daily precipitation
        records, etc.) within the requested time window. Each feature's
        `properties` bag carries at minimum `valid_time` plus the
        event-type-specific payload from the reader pipeline. As with
        `/v1/storm-reports`, additional `properties` keys may appear
        without a sw-api release.

        ### Time window

        Exactly one of three selectors is forwarded to the reader:

        1. `date=YYYY-MM-DD` — single-day window
        2. `start=...&end=...` — explicit RFC3339 window (both required
           together)
        3. `hours=N` — rolling lookback (1 ≤ N ≤ 720, i.e. 30 days)

        When more than one selector is set, the precedence is
        `date` > `start+end` > `hours`. The handler enforces this by
        forwarding all three to libs/wxreader, which picks the
        highest-priority selector.

        ### Filters

        - `wfo` — 3-letter NWS Weather Forecast Office identifier.
        - `type` — alphabetic record-event code (2-16 characters, e.g.
          `high`, `low`, `precip`, `snow`).

        ### Caching

        Successful responses carry `Cache-Control: public, max-age=60,
        stale-while-revalidate=60`. Mirrors the reader's
        recordEventsCacheTTL.

        ### Auth

        Standard sw-api Bearer auth applies.
      tags: [Storms]
      security:
        - bearerAuth: []
      parameters:
        - name: hours
          in: query
          required: false
          description: |
            Rolling lookback window in whole hours (1-720). Lowest
            precedence among the time-window selectors.
          schema:
            type: integer
            minimum: 1
            maximum: 720
          example: 168
        - name: date
          in: query
          required: false
          description: |
            ISO-8601 date (YYYY-MM-DD). Highest-precedence time-window
            selector; trumps `start+end` and `hours` when supplied.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2026-05-07"
        - name: start
          in: query
          required: false
          description: |
            RFC3339 timestamp marking the start of the window. Must
            be supplied together with `end`.
          schema:
            type: string
            format: date-time
          example: "2026-05-01T00:00:00Z"
        - name: end
          in: query
          required: false
          description: |
            RFC3339 timestamp marking the end of the window. Must be
            supplied together with `start`.
          schema:
            type: string
            format: date-time
          example: "2026-05-07T00:00:00Z"
        - name: wfo
          in: query
          required: false
          description: 3-letter NWS Weather Forecast Office identifier.
          schema:
            type: string
            pattern: '^[A-Za-z]{3}$'
            minLength: 3
            maxLength: 3
          example: "LOT"
        - name: type
          in: query
          required: false
          description: |
            Alphabetic record-event code (e.g. `high`, `low`,
            `precip`, `snow`). 2-16 characters.
          schema:
            type: string
            pattern: '^[A-Za-z]{2,16}$'
            minLength: 2
            maxLength: 16
          example: "high"
      responses:
        '200':
          description: |
            GeoJSON FeatureCollection. Empty `features` array when no
            record events match the window + filters.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/RecordEventsFeatureCollection'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '502':
          $ref: '#/components/responses/Problem502'
        '503':
          $ref: '#/components/responses/Problem503'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/geocode/reverse:
    get:
      operationId: getGeocodeReverse
      summary: Reverse-geocode a coordinate to a location.
      description: |
        Resolves a `(lat, lon)` coordinate into a city / nearest-city /
        state / county / IANA timezone tuple. Coverage is the supported
        NWS domain (CONUS, AK, HI, PR, GU/MP); coordinates outside the
        domain return a 404 Problem.

        ### Caching

        Successful responses carry `Cache-Control: public,
        max-age=86400`. The underlying place-name <-> timezone mapping
        changes on the order of years; clients should treat this as a
        long-term cache.

        ### Auth

        Standard sw-api Bearer auth applies.
      tags: [Geocode]
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude in decimal degrees, range [-90, 90].
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 41.8781
        - name: lon
          in: query
          required: true
          description: Longitude in decimal degrees, range [-180, 180].
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: -87.6298
      responses:
        '200':
          description: Resolved location metadata.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocodeResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '502':
          $ref: '#/components/responses/Problem502'
        '503':
          $ref: '#/components/responses/Problem503'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/geocode/autosuggest:
    get:
      operationId: getGeocodeAutosuggest
      summary: Typeahead-style location lookup.
      description: |
        Returns up to `count` location candidates whose names match the
        partial `input` string. Designed for client-side typeahead
        widgets: latency is dominated by the reader's PostGIS prefix
        index; `Cache-Control: public, max-age=300` keeps repeated
        keystrokes off the read replica.

        ### Auth

        Standard sw-api Bearer auth applies.
      tags: [Geocode]
      security:
        - bearerAuth: []
      parameters:
        - name: input
          in: query
          required: true
          description: |
            Partial place-name to expand. 2-128 characters, restricted
            to alphanumerics + spaces + `,`, `.`, `-`, and `'`.
          schema:
            type: string
            minLength: 2
            maxLength: 128
            pattern: "^[A-Za-z0-9 ,.\\-']+$"
          example: "Chic"
        - name: count
          in: query
          required: false
          description: |
            Maximum number of results (1-100). Defaults to 10.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
      responses:
        '200':
          description: |
            Match results. Empty `results` array when no candidates
            match the input.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResultsResponse'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '502':
          $ref: '#/components/responses/Problem502'
        '503':
          $ref: '#/components/responses/Problem503'
        '504':
          $ref: '#/components/responses/Problem504'

  /v1/geocode/search:
    get:
      operationId: getGeocodeSearch
      summary: Forward-geocode a place name or US ZIP.
      description: |
        Returns location candidates matching either a 5-digit US `zipcode`
        or a `city` (with optional `state` disambiguator). Exactly one
        of `city` or `zipcode` must be supplied.

        ### Caching

        Successful responses carry `Cache-Control: public,
        max-age=3600`. The underlying place-name <-> ZIP mapping is
        stable on the order of months.

        ### Auth

        Standard sw-api Bearer auth applies.
      tags: [Geocode]
      security:
        - bearerAuth: []
      parameters:
        - name: city
          in: query
          required: false
          description: |
            City name to resolve. Mutually exclusive with `zipcode`.
            Permits the same character set as `autosuggest.input`.
          schema:
            type: string
            minLength: 1
            maxLength: 128
          example: "Chicago"
        - name: state
          in: query
          required: false
          description: |
            Optional 2-letter US state code or full state name to
            disambiguate the city query. Ignored when `zipcode` is set.
          schema:
            type: string
            maxLength: 64
          example: "IL"
        - name: zipcode
          in: query
          required: false
          description: |
            5-digit US ZIP code. Mutually exclusive with `city`.
          schema:
            type: string
            pattern: '^\d{5}$'
            minLength: 5
            maxLength: 5
          example: "60601"
      responses:
        '200':
          description: |
            Match results. Empty `results` array when no candidates
            match the query.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
